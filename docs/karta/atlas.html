<title>Атлас Единства</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: атлас-инструмент — карта слева, «полевой журнал» справа; ночь Единства, золото Древа, синь Звездной Крови */
:root {
  --bg: #0e0c18;          /* ночное небо Единства */
  --surface: #161325;     /* панели */
  --surface-2: #1e1a33;
  --line: #2f2a4a;
  --ink: #ece7f7;
  --ink-2: #b3abcf;
  --ink-3: #8a82a8;
  --gold: #e3b860;        /* свет Игг-Древа, канон */
  --gold-dim: #a8843f;
  --blood: #63c7ec;       /* Звездная Кровь, маршруты */
  --dark: #07060d;        /* Тьма между Кругами */
  --shade: #2a2342;       /* Тени */
  --warn: #e88a6a;
  --font-display: "Cormorant SC", "Cormorant", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
.app { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; height: 100%; min-height: 560px; max-width: 1500px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .04em; margin: 0; color: var(--gold); text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 13px; }
nav.views { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
nav.views button, .chip, .tool {
  font: inherit; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
nav.views button[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); font-weight: 600; }
nav.views button:hover, .chip:hover, .tool:hover { border-color: var(--ink-3); color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blood); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bar .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 2px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; }
.chip[aria-pressed="true"] { background: var(--blood); border-color: var(--blood); color: var(--bg); font-weight: 500; }
.chip.tb[aria-pressed="false"] { border-style: dashed; }
.search { margin-left: auto; display: flex; gap: 6px; min-width: 0; }
.search input { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; width: 210px; max-width: 100%; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; min-height: 0; }
.mapwrap { position: relative; background: var(--dark); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 420px; }
svg.map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
svg.map.drag { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom .tool { background: var(--surface); padding: 4px 9px; font-size: 16px; line-height: 1; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; max-width: calc(100% - 20px); }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }
.viewnote { position: absolute; left: 10px; top: 10px; max-width: min(460px, calc(100% - 70px)); font-size: 12px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
aside.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: auto; padding: 14px 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0 0 2px; color: var(--ink); line-height: 1.15; text-wrap: balance; }
.panel h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; font-weight: 600; }
.panel p { margin: 6px 0; color: var(--ink-2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--ink-2); }
.pill.canon { border-color: var(--gold-dim); color: var(--gold); }
.pill.guess { border-style: dashed; color: var(--warn); border-color: var(--warn); }
.pill.rumor { border-style: dotted; color: var(--ink-3); }
.ev { border-left: 2px solid var(--line); padding: 4px 0 6px 10px; margin: 6px 0; }
.ev.hit { border-left-color: var(--blood); }
.ev .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ev .code { font-family: var(--font-mono); font-size: 12px; color: var(--blood); }
.ev .ch { font-size: 12px; color: var(--ink-3); }
.ev .t { font-weight: 600; color: var(--ink); }
.ev .s { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.ev .who { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.rel { font-size: 13px; color: var(--ink-2); margin: 6px 0; }
.rel q { display: block; color: var(--ink-3); font-style: italic; margin-top: 2px; quotes: "«" "»"; }
a.loc, button.loc { color: var(--gold); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--gold) 40%, transparent); text-underline-offset: 2px; }
ol.route { padding-left: 20px; margin: 6px 0; }
ol.route li { margin: 2px 0; color: var(--ink-2); }
ol.route li .off { color: var(--ink-3); font-size: 12px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stat div { background: var(--surface-2); border-radius: 8px; padding: 8px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 14px; overflow: auto; height: 100%; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
.card:hover { border-color: var(--ink-3); }
.card .n { font-weight: 600; }
.card .d { color: var(--ink-3); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .e { font-family: var(--font-mono); font-size: 11px; color: var(--blood); margin-top: 4px; }
.grouph { grid-column: 1 / -1; font-family: var(--font-display); font-size: 20px; color: var(--gold); margin: 6px 0 -2px; }
.results { display: grid; gap: 2px; margin: 4px 0; }
/* SVG */
.lbl-region { font-family: var(--font-display); font-weight: 600; letter-spacing: .12em; fill: var(--ink-2); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(7,6,13,.75); stroke-width: 3px; stroke-linejoin: round; }
svg.map .region ellipse { fill-opacity: .02; }
svg.map.terr .lbl-region { fill: #f6eed8; stroke: rgba(10,8,18,.85); stroke-width: 4px; vector-effect: non-scaling-stroke; }
svg.map.terr .lbl-note { fill: #cfc6e6; }
svg.map.terr .lbl-point { stroke: rgba(10,8,18,.88); stroke-width: 3.5px; vector-effect: non-scaling-stroke; }
.lbl-point { font-family: var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--dark); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.lbl-point.minor { fill: var(--ink-2); }
svg.z2 .lbl-point.lv2, svg.z3 .lbl-point.lv3 { display: none; }
.pt:hover .lbl-point, .pt.sel .lbl-point, .pt:focus-visible .lbl-point { display: inline !important; fill: var(--ink); }
.lbl-note { font-family: var(--font-body); fill: var(--ink-3); font-style: italic; text-anchor: middle; pointer-events: none; }
.pt { cursor: pointer; }
.pt circle.m { fill: var(--surface-2); stroke: var(--ink-2); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.pt.has circle.m { fill: var(--gold); stroke: #fff3d6; }
.pt.guess circle.m { stroke-dasharray: 3 2; }
.pt.dim { opacity: .22; }
.pt.sel circle.ring { stroke: var(--blood); stroke-width: 2.5px; fill: none; vector-effect: non-scaling-stroke; }
.pt:hover circle.m { stroke: var(--blood); }
.region { cursor: pointer; }
.region ellipse { fill: var(--ink); fill-opacity: .045; stroke: var(--ink-3); stroke-opacity: .35; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
.region:hover ellipse, .region.sel ellipse { fill-opacity: .09; stroke: var(--blood); stroke-opacity: .8; }
.route path { fill: none; stroke: var(--blood); stroke-width: 2.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.route .step { fill: var(--bg); stroke: var(--blood); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.route text { font-family: var(--font-mono); fill: var(--blood); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.allroutes path { fill: none; stroke: var(--blood); stroke-opacity: .16; stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
@media (max-width: 900px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .mapwrap { height: 70vh; min-height: 380px; }
  aside.panel { max-height: none; }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; }
  nav.views { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .pt circle.m, .region ellipse { transition: stroke .15s, fill-opacity .15s; } }
</style>

<div class="app">
  <header class="top">
    <h1>Атлас Единства</h1>
    <span class="sub">Карта мест и событий «Звездной Крови» и «Тысячи Братьев» Романа Прокофьева</span>
    <nav class="views" aria-label="Уровень карты" id="views"></nav>
  </header>
  <div class="bar" id="bar">
    <span class="lbl">Книга</span>
    <span id="chips" class="bar"></span>
    <div class="search"><input id="q" type="search" placeholder="Найти место…" aria-label="Найти место" autocomplete="off"></div>
  </div>
  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карта"></svg>
      <div class="cards" id="cards" hidden></div>
      <div class="viewnote" id="note"><span id="notetext"></span> <button class="loc" id="noteclose" aria-label="Скрыть пояснение">скрыть</button></div>
      <div class="zoom" id="zoomctl">
        <button class="tool" id="zin" aria-label="Приблизить">+</button>
        <button class="tool" id="zout" aria-label="Отдалить">−</button>
        <button class="tool" id="zreset" aria-label="Показать всю карту">⤢</button>
        <button class="tool" id="zterrain" aria-label="Рельеф или схема" title="Рельеф / схема">◐</button>
      </div>
      <div class="legend" id="legend">
        <div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--gold)" stroke="#fff3d6"/></svg>место с событиями (размер — число событий)</div>
        <div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="var(--surface-2)" stroke="var(--ink-2)"/></svg>место без отмеченных событий</div>
        <div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="none" stroke="var(--ink-2)" stroke-dasharray="3 2"/></svg>положение условное (в книгах не указано)</div>
        <div class="row"><svg width="22" height="10"><path d="M1 5 H21" stroke="var(--blood)" stroke-width="2.5"/></svg>маршрут героя выбранной книги</div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
const DATA = {"locations":[{"id":"kosmos","name":"Космос вне Единства","type":"космос","parent":null,"desc":"Внешнее пространство: настоящие звёзды, «осколки черных лун» и пояс камней вокруг дайсон-сферы. Сюда выбрасывает Псов Вечности через Брешь.","peoples":[],"terrain":"вакуум, абсолютный холод","first":"ТБ-4 Интерлюдия «Брешь»","xd":false,"cert":"канон","placed":true},{"id":"zemlya","name":"Земля / Солнечная система","type":"планета","parent":"kosmos","desc":"Родина колонистов (Большая Евразия, Аркто-Пацифика, Новая Аркона, Нео-Мумбаи, Мир-Кольцо как земная мегаструктура). Минос: Единство стоит на месте Солнечной системы, Солнце превратилось в чёрную дыру («шесть оборотов галактики»). Тождество «Земля = место Единства» — гипотеза героев.","peoples":["люди (земляне)"],"terrain":"","first":"ЗК-1 Интерлюдия «Хельга»","xd":false,"cert":"канон / частично гипотеза","placed":true},{"id":"a_prostranstvo","name":"А-пространство","type":"внепространство","parent":"kosmos","desc":"«Синяя бездна», через которую шёл ковчег; при выходе — «вспышка Грани». Связано с А-энергией (основа Звёздной Крови и Рун).","peoples":[],"terrain":"","first":"ЗК-1 Интерлюдия «Хельга»","xd":true,"cert":"канон","placed":true},{"id":"edinstvo","name":"Единство (дайсон-сфера)","type":"мегаструктура","parent":"kosmos","desc":"Сплошная сфера Дайсона диаметром ≈2,5 а.е. (граница между орбитами Земли и Марса), построенная Кел вокруг звезды, ставшей чёрной дырой. Обитаема ВНУТРЕННЯЯ поверхность: «площадь в сотни миллионов раз больше Земли», десятки тысяч Кругов. Поверхность разбита иллиумовым каркасом на «бесчисленные» октагоны, разделённые Великими Стенами; на стыках — Башни. Горизонт не обрывается, а «поднимается» слоями. Над головой — Небесный Трон (центр сферы).","peoples":["Кел (ушли в Вечность)","десятки Народов, «триллионы разумных»"],"terrain":"внутренняя поверхность сферы: Круги Жизни под Игг-Древами, Тень, Тьма","first":"ЗК-1 гл.23","xd":false,"cert":"канон","placed":true},{"id":"obolochka","name":"Оболочка и «кости Единства»","type":"оболочка","parent":"edinstvo","desc":"Многослойная иллиумовая броня сферы с «глубинными горизонтами» и полыми ходами (жилы воды, небесного огня, воздуха, подземные пути). Снаружи — Великие Инскрипции размером с октагон (голубые и изумрудные защитные знаки). Под Эстэ герои спускаются к «костям Единства» (сферический зал Строителей).","peoples":[],"terrain":"иллиум, подземные горизонты, Логова Червей","first":"ЗК-4 Пролог; ТБ-2 гл.3; ТБ-4 Интерл. «Брешь»","xd":false,"cert":"канон","placed":true},{"id":"bresh","name":"Брешь","type":"пролом","parent":"obolochka","desc":"Разлом в оболочке дайсон-сферы, «затянутый мерцающей пленкой»; у оплавленных краёв — огоньки дрейф-цитаделей Ордена Истинных. Защитник (Тот-Кто-Сражается) нёс здесь вечный дозор. Из сферы наружу выйти можно, вернуться минуя Брешь — нельзя.","peoples":["Орден Истинных"],"terrain":"","first":"ЗК-2 Пролог; ЗК-8 гл.12; ТБ-4 Интерл. «Брешь»","xd":false,"cert":"канон","placed":true},{"id":"al_minastir","name":"Аль-Минастир","type":"дрейф-цитадель","parent":"bresh","desc":"Дрейф-цитадель Ордена Истинных: золотая «корона» в облачной толще у Бреши («Ты у проломленных врат Единства. Здесь мы несем свой дозор»). Кольцо подобных цитаделей; вдали — «сломанные кости Единства».","peoples":["Орден Истинных","Тайновидица"],"terrain":"","first":"ЗК-8 гл.12","xd":false,"cert":"канон","placed":true},{"id":"nebesny_tron","name":"Небесный Трон (диск аккреции)","type":"астрообъект","parent":"edinstvo","desc":"Астроинженерная крепость вокруг чёрной дыры в центре сферы; виден как «синяя игла»/«голубое веретено» днём и «око Вечности» (овал, пронзённый иглой) ночью; смена его формы = смена Знака небесного календаря. Даёт вторую тень; ночной свет.","peoples":[],"terrain":"чёрная дыра, диск аккреции, релятивистские струи","first":"ЗК-1 гл.1 (как «солнце-веретено»); ЗК-3 Аннотация","xd":false,"cert":"канон","placed":true},{"id":"vechnost","name":"Вечность","type":"иное измерение","parent":"nebesny_tron","desc":"«Загробный мир» избранных Восходящих внутри Небесного Трона; мультиверсум из тысяч миров, «разросшийся из копии дайсон-сферы». Правят 7 Хранителей Вечности, Дома Кел. Вход — смерть со стигматом, Бассейны Душ, нити-аватары, Храмы Вечности.","peoples":["Кел-нео","Хранители Вечности","Дома: Норн, Вортекс, Темные Звезды, Эррос, Ноктис…","Ковенант"],"terrain":"","first":"ЗК-1 гл.8; ЗК-5 гл.5","xd":true,"cert":"канон","placed":true},{"id":"kamni","name":"Камни (мир-осколок)","type":"мир","parent":"vechnost","desc":"Мир-осколок с колонией рудокопов; первая точка выхода отражения Сигурда, золотые комары-стражи; до Врат ~300 км.","peoples":[],"terrain":"","first":"ЗК-5 гл.6","xd":true,"cert":"канон","placed":false},{"id":"zolotoy_gorod","name":"Золотой Город","type":"город","parent":"vechnost","desc":"Столица Вечности: голубое небо, солнце как земное, нет Игг-Древа; платформа Врат (12+ арок), диски-острова в мили диаметром вокруг золотого столпа; город-зиккурат из террас «занимает целый октагон (≈ средний Круг Жизни)». Калька с прежней столицы Единства.","peoples":["Кел-нео","Ковенант","Контракция"],"terrain":"","first":"ЗК-2 гл.19","xd":true,"cert":"канон","placed":false},{"id":"dom_kubkov","name":"Дом (Дворец) Кубков и Храм Наслаждений","type":"квартал","parent":"zolotoy_gorod","desc":"Увеселительные заведения Золотого Города; у Дома Кубков — арка-портал в Тёмное.","peoples":[],"terrain":"","first":"ЗК-5 гл.10–11","xd":true,"cert":"канон","placed":false},{"id":"temnoe","name":"Тёмное","type":"домен","parent":"zolotoy_gorod","desc":"Теневая «изнанка» Золотого Города, отдельный Домен без узлов небесной сети; контрактории, покровительство Хитрейшего.","peoples":[],"terrain":"","first":"ЗК-6 гл.14","xd":true,"cert":"канон","placed":false},{"id":"nebesnye_terrasy","name":"Небесные Террасы","type":"квартал","parent":"zolotoy_gorod","desc":"Аристократический квартал над облаками, представительства великих Домов (Вортекс и др.).","peoples":[],"terrain":"","fir :true},{"id":"hram_pervogo_shaga","name":"Храм Первого Шага","type":"храм","parent":"serebryany_zamok","desc":"Руна-Башня, «малая экстрамерность» для испытаний бронзы (цилиндрический колодец, зелёный свет). Вход из Домена.","peoples":[],"terrain":"","first":"ЗК-5 гл.4","xd":true,"cert":"канон","placed":false},{"id":"hram_vtorogo_shaga","name":"Храм Второго Шага (Лабиринт)","type":"храм","parent":"edinstvo","desc":"Испытание серебра: спиральная лестница вниз, Испытание Воли.","peoples":[],"terrain":"","first":"ЗК-8 гл.11","xd":true,"cert":"канон","placed":false},{"id":"hram_tretego_shaga","name":"Храм (Обитель) Третьего Шага","type":"храм","parent":"edinstvo","desc":"Испытание золота; лишь упоминается.","peoples":[],"terrain":"","first":"ЗК-8 гл.11","xd":true,"cert":"канон","placed":false},{"id":"serebryany_zamok","name":"Серебряный Замок","type":"домен","parent":"edinstvo","desc":"Домен Азимандии Визу Аран, затем — Сигурда и колонии Небо: сиреневое небо с галактиками, шпили, водопад, изумрудный сад, остров-лаборатория над бездной (кости жертв), зал Саркофагов, Реликварий Кейнора. Вход — озерцо у тропы (кристалл-стражи). Ядро (кристалл-сфера в иллиумовой оковке) — в склепе в мёртвых «тёмных землях» за Стрелой Домена.","peoples":["кел Визу Аран","земляне (лаборатория Миноса)"],"terrain":"","first":"ЗК-2 гл.18","xd":true,"cert":"канон","placed":false},{"id":"kriptа_yadra_zamka","name":"Склеп ядра Серебряного Замка","type":"склеп","parent":"temnye_zemli","desc":"Изолированная камера (−77 °C) в мёртвых октагонах, где в столбе вмурована кристалл-сфера Домена («яйцо кощеево»).","peoples":[],"terrain":"","first":"ЗК-8 гл.2–3","xd":false,"cert":"канон","placed":false},{"id":"ostrov_trav","name":"Остров Трав","type":"домен","parent":"edinstvo","desc":"Домен Говорящей-с-Травами: треугольный остров в пустоте (~футбольное поле), серое светящееся небо, хижина Винсента, плантация трав, «стрела Переноса». Начальная стадия Домена. Кристалл-сфера позже в лаборатории Неба.","peoples":["Говорящая-с-Травами"],"terrain":"","first":"ЗК-5 гл.? (упом.); ЗК-6 гл.25","xd":true,"cert":"канон","placed":false},{"id":"razbitaya_skrizhal","name":"Домен-Сокровище «Разбитая Скрижаль» (Домен Белого Дьявола)","type":"домен","parent":"edinstvo","desc":"Семь платформ золотого лиора, мосты застывшего света, призрак-хранитель Архитектор. Стрела Домена ведёт к Башне Молний; кристалл-сфера — на вершине Башни Молний. В ЗК-10 повышен до золота (площадь ×64).","peoples":[],"terrain":"","first":"ТБ-3 гл.2","xd":true,"cert":"канон","placed":false},{"id":"ergial","name":"Ледяные Чертоги Эргиаля","type":"цитадель-домен","parent":"ledyanaya_bezdna","desc":"Древний Домен Ледяного Кузнеца (Кейнор), «приземлённый» в Ледяной Бездне: город из звёздного льда, лед-кузнецы, Чертог Пробуждения, башня Кузнеца с троном. «В Эргиаль можно войти, но нельзя выйти». ~100 млн км от фригольда Небо (по Скай). Наполовину разрушен в битве с Гармонией.","peoples":["лед-кузнецы","криархи","великаны-айсгарды"],"terrain":"звёздный лёд, ледяные разломы, −37 °C","first":"ЗК-2 гл.? (упом.); ЗК-8 гл.19; ТБ-2 Аннотация","xd":false,"cert":"канон","placed":true},{"id":"hartlend","name":"Хартленд Корпуса (Хранилища Ноктис)","type":"домен","parent":"edinstvo","desc":"Подземные/экстрамерные хранилища дома Ноктис (Корпус наёмников): арсеналы, доспехи Кор Ноктис в столбах остановленного времени. Вход по Ключу Оноры.","peoples":[],"terrain":"","first":"ЗК-8 гл.17–18","xd":true,"cert":"канон","placed":false},{"id":"proklyatoe_svyatilishche","name":"Проклятое Святилище (Руна-Арена)","type":"арена","parent":"edinstvo","desc":"Рунная арена поединков Восходящих; чемпион Орин (Народ Огня). Перенос по вызову.","peoples":[],"terrain":"","first":"ТБ-1 гл.17","xd":true,"cert":"канон","placed":false},{"id":"perekrestok","name":"Перекрёсток Великих Караванов","type":"домен","parent":"edinstvo","desc":"Домен — каменное колесо в пустоте: ступица Камень Странника, спицы-дороги, небосвод = Атлас Путей (вращающаяся карта Кругов). Фрагмент паутины Путей до Раскола.","peoples":[],"terrain":"","first":"ТБ-5 гл.1","xd":true,"cert":"канон","placed":false},{"id":"domen_lovushka","name":"Домен-ловушка Абсолютной Пустоты","type":"домен","parent":"este","desc":"Ловушка Белого Дьявола для Псов Вечности в Эстэ: без Рун и Скрижалей, узлы хронозахвата; перенесён Кузнецом.","peoples":[],"terrain":"","first":"ТБ-4 гл.6","xd":true,"cert":"канон","placed":false},{"id":"oktagon_eltanir","name":"Октагон Элтанир","type":"октагон","parent":"edinstvo","desc":"Древний октагон; Круг занимает лишь его часть («освещена едва ли половина Евразии»). Все его Стены и 4 Башни — во Тьме. «Второе кольцо» от октагона Колонии Альфа (Заов). Теневое кольцо касается лишь западной грани.","peoples":[],"terrain":"","first":"ЗК-6 гл.9; ЗК-11 гл.7, гл.21","xd":false,"cert":"канон","placed":true},{"id":"krug_eltanir","name":"Круг Элтанир","type":"круг","parent":"oktagon_eltanir","desc":"Круг Жизни под Великим Игг-Древом Элтанир (+ «четыре младших брата» — Малые Древа, вкл. Пылающий Рог и Росток «Небо»). Диаметр ≈5000 км (Минос). Земляне считают фригольд «южной точкой», Древо — центром. «Провинция» по сравнению с Заовом. Бывшее царство Белого Дьявола (столица Эстэ).","peoples":["Народ Древа (Ветвей)","Народ Трав","Народ Реки","Народ Земли (земляне)","Народ Леса","Народ Камня","Народы Гор и Пещер","Народ Моря (нордийцы)","Народ Теней (на окраинах)","Народ Тавров (дикие)"],"terrain":"центр — Благословение; запад/юго-запад — степь Море Трав; восток/юго-восток — реки, озёра, болота; север — море и острова","first":"ЗК-1 гл.1 (Древо); название — ТБ-1 гл.12, ЗК-6 гл.20","xd":false,"cert":"канон","placed":true},{"id":"drevo_eltanir","name":"Великое Игг-Древо Элтанир","type":"древо","parent":"blagoslovenie","desc":"Золотое Великое Древо: высота по оценке героя 15–20 км («вымахало не меньше пятнадцати-двадцати»), ветви «на тысячи километров», кора — пластины-доспех; ярусы: Корни (омываются озером), Ствол, Ветви первого яруса, Солнечная Ветвь; Золотые Термиты, Игг-Смола. Источник дневного света Круга.","peoples":["Народ Древа (Люди Ветвей)","Хранители Древа (Золотые Стрекозы)"],"terrain":"","first":"ЗК-1 гл.1","xd":false,"cert":"канон","placed":true},{"id":"blagoslovenie","name":"Земли Благословения","type":"регион","parent":"krug_eltanir","desc":"Сердце Круга вокруг Великого Древа: «нет преступлений, невозможны убийства и войны». С севера подходит залив; границы — горная гряда (синие горы) с каскадом водопадов; входы — «стокилометровые прорехи» (Западный Проход, южные врата). В Дикую Охоту границы закрываются. Владычица — Иниэсс Зелёный Лист (кинг Народа Древа).","peoples":["Народ Древа"],"terrain":"золотые рощи, озеро у корней","first":"ЗК-1 гл.22","xd":false,"cert":"канон","placed":true},{"id":"tingvellir","name":"Тингвеллир","type":"святилище","parent":"blagoslovenie","desc":"Место тинга у основания Ствола: черно-золотой корень-эстакада к арке, амфитеатр на десятки тысяч мест, круги-трибуны Народов, овальная арена фионтаров.","peoples":[],"terrain":"","first":"ЗК-6 гл.20","xd":false,"cert":"канон","placed":true},{"id":"zaliv_blagosloveniya","name":"Залив Благословения","type":"залив","parent":"krug_eltanir","desc":"Залив, подходящий к Благословению с севера.","peoples":[],"terrain":"","first":"ЗК-6 гл.10","xd":false,"cert":"канон","placed":true},{"id":"sinie_gory","name":"Синие горы (гряда Благословения)","type":"горы","parent":"krug_eltanir","desc":"Горная стена вокруг Благословения; река прорезает её «исполинским каскадом водопадов» — «одно из чудес нашего Круга». Видны из Эстэ.","peoples":[],"terrain":"","first":"ЗК-6 гл.26; ТБ-4 гл.9","xd":false,"cert":"канон","placed":true},{"id":"zapadny_prohod","name":"Западный Проход","type":"перевал","parent":"krug_eltanir","desc":"Холмистый край с рощами золотых деревьев между Морем Трав и Благословением — «стокилометровая прореха» в горах.","peoples":[],"terrain":"","first":"ЗК-6 гл.10","xd":false,"cert":"канон","placed":true},{"id":"yuzhnye_vrata","name":"Южные горные врата Благословения","type":"перевал","parent":"krug_eltanir","desc":"Путь, которым земляне обычно ходят к Древу.","peoples":[],"terrain":"","first":"ЗК-6 гл.10, гл.26","xd":false,"cert":"канон","placed":true},{"id":"more_trav","name":"Море Трав","type":"регион","parent":"krug_eltanir","desc":"Бескрайняя желто-зелёная степь, трава выше человеческого роста, холмы и рощи. По разным местам — «почти вся западная половина Круга» / «южная, юго-западная и западная часть», переходит в теневые земли; с запада прикрыто Стеной октагона. Земли Народа Трав, тавров, шёлковых птиц, тауро.","peoples":["Народ Трав (эль)","тавры (дикие быколюди)"],"terrain":"степь, рощи, холмы","first":"ЗК-1 гл.12","xd":false,"cert":"канон","placed":true},{"id":"pylayushchiy_rog","name":"Пылающий Рог","type":"древо","parent":"more_trav","desc":"Одно из трёх Малых Древ Круга, молодое (не даёт Семян); столица Народа Трав; рядом купольные гарнизон-капсулы Наблюдателя. На западной границе Круга, «в сердце степей»; с запада прикрыт Стеной, с юга и востока — горами.","peoples":["Народ Трав"],"terrain":"","first":"ЗК-1 гл.14","xd":false,"cert":"канон","placed":true},{"id":"ferma_eirika","name":"Ферма (ранчо) Эйрика","type":"ферма","parent":"more_trav","desc":"Укреплённое ранчо Эйрика в Море Трав «милях в ста к югу от наших гор»; тауро, шёлковые птицы, цезари; сторожевые башни. От Стрелы — «почти день пути». Позже Эйрик переселяется на плато Неба.","peoples":["Народ Земли","нордийцы (жёны Эйрика)"],"terrain":"","first":"ЗК-2 гл.10","xd":false,"cert":"канон","placed":true},{"id":"strela_more_trav","name":"Стрела (выход в Море Трав)","type":"портал","parent":"more_trav","desc":"Конец древнего транслокатора Кел в земле Народа Трав; отсюда виден «приметный трёхрогий пик».","peoples":[],"terrain":"","first":"ЗК-1 гл.12","xd":false,"cert":"канон","placed":true},{"id":"strela_burnaya","name":"Стрела у Бурной («Наконечник Стрелы»)","type":"портал","parent":"ozerny_kray","desc":"Конец Стрелы на утёсе над гибели Всполох (ТБ-4).","peoples":[],"terrain":"","first":"ЗК-4 гл.21; ЗК-8 гл.17","xd":false,"cert":"канон","placed":true},{"id":"shpili_este","name":"Шпили-Стражи и Мечи Эстэ","type":"укрепления","parent":"este","desc":"12 Шпилей, каждый хранил Меч жёсткого света; по их границе Наблюдатель прочертил запретную зону.","peoples":[],"terrain":"","first":"ТБ-1 гл.12, гл.14","xd":false,"cert":"канон","placed":true},{"id":"stancii_este","name":"Станции транслокации Эстэ","type":"узлы","parent":"este","desc":"Знак Переноса открывает: Башня Изобилия, Сфера Небесной Энергии, Великий Архив Снов; Купол Вознесения (место падения Небесного Ястреба). Позже — Кузницы Света, Архив Забвения, Дом Стрелков.","peoples":[],"terrain":"","first":"ЗК-4 гл.19–20; ТБ-4 гл.2–3","xd":false,"cert":"канон","placed":true},{"id":"ubezhishche","name":"Убежище изгоев (Шторм)","type":"лагерь","parent":"este","desc":"Подземный зал-резиденция Кнута (Ларссона) в руинах Шторма, личный Портал; точка эвакуации экспедиций.","peoples":["изгои"],"terrain":"","first":"ЗК-5 гл.19; ЗК-6 гл.1","xd":false,"cert":"канон","placed":true},{"id":"zemli_naroda_reki","name":"Земли Народа Реки","type":"регион","parent":"krug_eltanir","desc":"Речные долины, озёра, леса и болота «условного востока и юго-востока Круга»; один из четырёх крупнейших Народов. Кланы: Мёртвая Рыба, Болотные Пещеры, Тростник, Холодное Озеро/Холодные Воды, Золотое Озеро.","peoples":["Народ Реки (речники)"],"terrain":"","first":"ЗК-1 гл.10; ЗК-6 гл.3","xd":false,"cert":"канон","placed":true},{"id":"mertvaya_ryba","name":"Мёртвая Рыба","type":"фригольд","parent":"zemli_naroda_reki","desc":"Крупнейший фригольд Людей Реки в скелете чудовищной рыбы посреди реки (рёбра — стены, водопад сквозь пасть). Рикс Аурвак Владыка Чешуи. К югу от гряды, за которой Эстэ.","peoples":["Народ Реки"],"terrain":"","first":"ЗК-1 гл.10; ТБ-1 гл.7","xd":false,"cert":"канон","placed":true},{"id":"bolotnye_peshchery","name":"Болотные Пещеры","type":"поселение","parent":"zemli_naroda_reki","desc":"Клан Людей Реки: «затопленные тоннели в исполинской стене на границе Круга»; уничтожен фроггами в Дикую Охоту.","peoples":[],"terrain":"","first":"ЗК-6 гл.3; ТБ-1 гл.8–10","xd":false,"cert":"канон","placed":true},{"id":"zolotoe_ozero","name":"Золотое Озеро","type":"озеро","parent":"zemli_naroda_reki","desc":"«Теплейший и крупнейший водоём в этом Круге»; озёрный край к северо-востоку от земель Болотных Пещер.","peoples":[],"terrain":"","first":"ТБ-1 гл.8","xd":false,"cert":"канон","placed":true},{"id":"bolota_yv","name":"Болота юго-востока","type":"болото","parent":"zemli_naroda_reki","desc":"«На юго-востоке до самой Стены простирались бесконечные болота».","peoples":[],"terrain":"","first":"ТБ-1 гл.8","xd":false,"cert":"канон","placed":true},{"id":"zabytye_ozera","name":"Озеро локи («Забытые Озёра»)","type":"озеро","parent":"zemli_naroda_reki","desc":"Озеро с локи; Белый Дьявол открыл на дне Портал «Забытые Озёра».","peoples":[],"terrain":"","first":"ТБ-1 гл.13","xd":false,"cert":"канон (точная локализация неизвестна)","placed":true},{"id":"severnoe_poberezhe","name":"Северное побережье и острова (Народ Моря)","type":"регион","parent":"krug_eltanir","desc":"«Далеко на севере нашего Круга» — побережье и острова нордийцев; карта неизвестна. По слухам, на острове в северном море — Священный Город золотого Восходящего с малым Кругом.","peoples":["нордийцы (Народ Моря, Люди Островов)"],"terrain":"","first":"ЗК-1 гл.15; ЗК-4 гл.8","xd":false,"cert":"канон","placed":true},{"id":"svyashchenny_gorod","name":"Священный Город","type":"город","parent":"severnoe_poberezhe","desc":"Слух нордалов: город на острове в северном море, правит золотой Восходящий, «там есть малый Круг».","peoples":[],"terrain":"","first":"ЗК-1 гл.15","xd":false,"cert":"слух","placed":true},{"id":"gory_neba","name":"Ничейные горы (горный массив Неба)","type":"горы","parent":"krug_eltanir","desc":"Горная гряда на краю Круга, «естественная преграда между бесплодной… равниной на краю Круга [Расколотые Земли] и Морем Трав»; «всего одна дорога». Розовые/серые призматические скалы, горячие озёра.","peoples":["Народ Земли"],"terrain":"","first":"ЗК-1 гл.14–15; ЗК-2 гл.12","xd":false,"cert":"канон","placed":true},{"id":"nebo","name":"Фригольд «Небо»","type":"фригольд","parent":"gory_neba","desc":"Колония землян (Народ Земли): плато-прямоугольник, утёсы с трёх сторон и пропасть с четвёртой; модульные корпуса, теплицы в 2–3 милях, колумбарий, бар «Виски». «Крайняя южная точка» Круга (земная условность). С ЗК-6 — Росток Игг-Древа. Население ~3000 (ЗК-11).","peoples":["Народ Земли (земляне «Хельги»)"],"terrain":"горное плато","first":"ЗК-1 гл.12–16","xd":false,"cert":"канон","placed":true},{"id":"yuzhny_post","name":"Южный Пост","type":"застава","parent":"gory_neba","desc":"Частокол из копейного дерева, трап, гаусс-турели, ловушка-камнепад; ведёт к Морю Трав. Пал в ЗК-7 гл.16 (тавры), восстанавливается в ЗК-9.","peoples":[],"terrain":"","first":"ЗК-1 гл.13–14","xd":false,"cert":"канон","placed":true},{"id":"zapadny_post","name":"Западный Пост","type":"застава","parent":"gory_neba","desc":"~25 миль от фригольда на единственной тропе со стороны Расколотых Земель; отсюда изгнан Марк.","peoples":[],"terrain":"","first":"ЗК-2 гл.12","xd":false,"cert":"канон","placed":true},{"id":"treti_post","name":"Третий Пост («Скала»)","type":"застава","parent":"nebo","desc":"Скала со срезанной вершиной у плато.","peoples":[],"terrain":"","first":"ЗК-3 Эпилог","xd":false,"cert":"канон","placed":true},{"id":"post_sedmoy","name":"Пост Седьмой / портальная камера","type":"застава","parent":"nebo","desc":"Изолированный бокс-приёмник у пещер плато для Рун-Порталов колонии (шлюз, огневые точки).","peoples":[],"terrain":"","first":"ЗК-8 гл.3; ЗК-10 гл.5","xd":false,"cert":"канон","placed":true},{"id":"rostok_neba","name":"Росток Игг-Древа «Небо»","type":"древо","parent":"nebo","desc":"Семя со дна озера Девы, посаженное «примерно посередине между зданиями фригольда и Южным Постом» на границе света и тени; к ТБ-3 видно из Теней как вторая звезда.","peoples":[],"terrain":"","first":"ЗК-6 гл.26","xd":false,"cert":"канон","placed":true},{"id":"ruiny_forta_kel","name":"Руины форта Кел / аванпост Вечности под фригольдом","type":"руины","parent":"nebo","desc":"Развалины на краю плато (логово гигантопитеков); под ними — Саркофаги с отражениями трёх Преображающих (Псов). Взорваны при их пробуждении (ЗК-9 Эпилог).","peoples":[],"terrain":"","first":"ЗК-1 гл.19; ЗК-7 Эпилог; ЗК-8 гл.1","xd":false,"cert":"канон","placed":true},{"id":"ledyanoy_velikan","name":"Ледяной Великан (Хладноцветы)","type":"урочище","parent":"gory_neba","desc":"Место с Хладноцветами под защитой Единства (задание Наблюдателя).","peoples":[],"terrain":"","first":"ЗК-2 гл.5","xd":false,"cert":"канон (точное положение неизвестно)","placed":true},{"id":"zmeiny_kanyon","name":"Змеиный Каньон","type":"каньон","parent":"gory_neba","desc":"Естественная граница горного фригольда; тропа от Западного Поста в Расколотые Земли.","peoples":[],"terrain":"","first":"ЗК-6 гл.28; ТБ-1 гл.1","xd":false,"cert":"канон","placed":true},{"id":"podkova","name":"Подкова","type":"плато","parent":"raskolotye_zemli","desc":"Дугообразное плато ~10 м над Расколотыми Землями в паре десятков км от скал фригольда; битва с Прыгунами.","peoples":[],"terrain":"","first":"ЗК-7 гл.10","xd":false,"cert":"канон","placed":true},{"id":"gory_lyudey_gor","name":"Горы Людей Гор и Пещер","type":"горы","parent":"krug_eltanir","desc":"Горные долины «восточнее» колонии (три клана Людей Гор, ТБ-1) и горные районы к западу (ЗК-9) — кланы Гор, Пещер; три фригольда Людей Гор уничтожены Псами в 200 км.","peoples":["Народ Гор","Народ Пещер"],"terrain":"","first":"ТБ-1 гл.1–2; ЗК-9 гл.4; ЗК-10 гл.4","xd":false,"cert":"канон","placed":true},{"id":"stena_zapad","name":"Западная Стена октагона Элтанир","type":"стена","parent":"oktagon_eltanir","desc":"«Подобная исполинскому горному хребту Стена» — граница октагона, на западе близко подходит к Кругу; прикрывает Море Трав и Пылающий Рог.","peoples":[],"terrain":"","first":"ЗК-6 гл.9; ЗК-9 гл.4","xd":false,"cert":"канон","placed":true},{"id":"yz_bashnya","name":"Юго-западная Башня октагона Элтанир","type":"башня","parent":"oktagon_eltanir","desc":"Мёртвая Башня: щиты пали, выжжена изнутри «небесным огнём»; вокруг спекшиеся черные равнины. Под ней — Улей Червей.","peoples":[],"terrain":"","first":"ЗК-11 гл.21","xd":false,"cert":"канон","placed":true},{"id":"raskolotye_zemli","name":"Расколотые Земли","type":"регион","parent":"oktagon_eltanir","desc":"Бесплодная изборождённая трещинами равнина на краю Круга (вне светового круга: «до Круга два дня пути»); ~300 км до теневой полосы; Гнёзда Червей, инсектоиды. Бывшая граница Круга.","peoples":[],"terrain":"","first":"ЗК-1 гл.15; ЗК-2 гл.13","xd":false,"cert":"канон","placed":true},{"id":"gnezdo_chervey","name":"Гнездо Червей (Расколотые Земли)","type":"логово","parent":"raskolotye_zemli","desc":"Гнездо тхи-усс; Сигурд падает туда, Семя сжигает >400 тварей; точка входа/выхода в Серебряный Замок.","peoples":[],"terrain":"","first":"ЗК-2 гл.14–16","xd":false,"cert":"канон","placed":true},{"id":"kolonna_siyaniya","name":"Колонна Сияния / аванпост Наблюдателя","type":"аванпост","parent":"raskolotye_zemli","desc":"Разрушенная цитадель Наблюдателя (зирдин); «Столп» — у него не работают Руны (радиус ~9–10 миль). Место малого тинга Теней.","peoples":[],"terrain":"","first":"ЗК-3 гл.4–9; ТБ-3 Интерл.","xd":false,"cert":"канон","placed":true},{"id":"zemli_teney","name":"Земли Теней (теневые земли)","type":"регион","parent":"oktagon_eltanir","desc":"Пояс вечного заката между Кругом и Тьмой: «незамкнутое полукольцо, прерванное на условном севере морским побережьем»; на юге — Чёрная Пасть, на западе — Стена, на востоке — Черепа. Две тени, сумерки (зарево Древа + Небесный Трон), теневой биом.","peoples":["Народ Теней (септы: Каменные Луки, Небесные Когти, Луноликие, Черепа, Грозы, Серые Шипы…)"],"terrain":"деревья-скелеты, тенелоза, поля колючек","first":"ЗК-3 Аннотация","xd":false,"cert":"канон","placed":true},{"id":"kamennye_luki","name":"Каменные Луки","type":"город-цитадель","parent":"zemli_teney","desc":"Крупнейшее поселение Теней, столица септы: башни Кел в форме луков/парусов, рог из чёрного стекла — на деле астролит Кел Аммос (оружие небесного ранга). Резиденция Пламени Подобного в ТБ-3.","peoples":["Каменные Луки"],"terrain":"","first":"ЗК-3 гл.17","xd":false,"cert":"канон","placed":true},{"id":"nebesnye_kogti","name":"Поселение Небесных Когтей","type":"поселение","parent":"zemli_teney","desc":"Колонны-шипы, выращенные купольные дома, хоф, свет-древо на площади; вход через Портал.","peoples":["Небесные Когти (рикс Коготь-как-Серебро)"],"terrain":"","first":"ЗК-3 гл.11","xd":false,"cert":"канон","placed":true},{"id":"cherep_velikana","name":"Череп Великана","type":"цитадель","parent":"zemli_teney","desc":"Древняя кел-цитадель в форме головы «глубоко в тенях на восточной оконечности Круга» — логово Черепов и Всадника.","peoples":["Черепа"],"terrain":"","first":"ТБ-3 гл.9","xd":false,"cert":"канон","placed":true},{"id":"zemli_lunolikih","name":"Земли Луноликих и Язва","type":"регион","parent":"zemli_teney","desc":"Септа Луноликих «на северо-западе сумрачной зоны»; рядом Язва — дыра, через которую Черви пролезли в Круг; Ничейные Пустоши.","peoples":["Луноликие"],"terrain":"","first":"ЗК-9 гл.4–5; ЗК-11 гл.21","xd":false,"cert":"канон","placed":true},{"id":"zemli_groz","name":"Земли Гроз и Кузница Молний","type":"регион","parent":"zemli_teney","desc":"Владения септы Гроз; Кузница Молний захвачена Черепами, битва и смерть Всадника.","peoples":["Грозы"],"terrain":"","first":"ТБ-3 гл.10–15","xd":false,"cert":"канон","placed":true},{"id":"pustoshi_soli","name":"Пустоши Соли","type":"пустошь","parent":"zemli_teney","desc":"«Далеко на юге, за горами… белесые пустоши Соли и полоса теневых земель» (вид из земель Народа Реки).","peoples":[],"terrain":"","first":"ТБ-1 гл.5","xd":false,"cert":"канон","placed":true},{"id":"chernaya_past","name":"Чёрная Пасть","type":"каньон","parent":"oktagon_eltanir","desc":"Огромный каньон с пещерами и тоннелями на юге, граница темных земель, гнёзда Червей; «−50 °C, O₂ 13 %»; споровый туман. Тут разбился винтокрыл «Одиссея», здесь путь через Тьму к Таиру; в ЗК-11 — Улей и плацдарм.","peoples":[],"terrain":"","first":"ЗК-3 гл.13–15","xd":false,"cert":"канон","placed":true},{"id":"molchanie","name":"Молчание (лагерь у Пасти)","type":"лагерь","parent":"chernaya_past","desc":"Перевалочный пункт охотников на Червей у Чёрной Пасти.","peoples":[],"terrain":"","first":"ТБ-3 гл.10","xd":false,"cert":"канон","placed":true},{"id":"temnye_zemli","name":"Тьма / мёртвые («тёмные») октагоны","type":"регион","parent":"edinstvo","desc":"Ледяные безвоздушные пространства между Кругами (тысячи — десятки тысяч км), рассадники Червей и пустотников.","peoples":[],"terrain":"","first":"ЗК-1 гл.23; ЗК-8 гл.2","xd":false,"cert":"канон","placed":true},{"id":"gorn","name":"Горн","type":"крепость","parent":"edinstvo","desc":"Вулканическая крепость Народа Огня, куда отправлены останки Орина.","peoples":["Народ Огня"],"terrain":"","first":"ТБ-1 Эпилог","xd":false,"cert":"канон (положение неизвестно)","placed":true},{"id":"lor_aion","name":"Лор-Айон","type":"дрейф-город","parent":"edinstvo","desc":"Дрейф-город, где ведутся переговоры (ЗК-11 гл.21).","peoples":[],"terrain":"","first":"ЗК-11 гл.21","xd":false,"cert":"канон (положение неизвестно)","placed":true},{"id":"krug_tair","name":"Круг Таир","type":"круг","parent":"edinstvo","desc":"«Разрушенный» Круг с рубиновым (алым) светом, ближайший к Элтаниру: в самом узком месте 1500 км Тьмы. Станция Терра (колония землян), Караванный Круг.","peoples":["земляне Станции Терра","Камнерожденные (подземные города)"],"terrain":"","first":"ЗК-10 гл.8","xd":false,"cert":"канон","placed":true},{"id":"karavanny_krug","name":"Караванный Круг Таира","type":"город","parent":"krug_tair","desc":"Одно из крупнейших посе ит","distance":"","source":"ЗК-6 гл.26","quote":"синюю ленту реки, проходящую сквозь нее исполинским… каскадом водопадов, — одно из чудес нашего Круга и естественную границу Благословения"},{"a":"este","b":"blagoslovenie","kind":"граничит","distance":"за горами","source":"ТБ-4 гл.9","quote":"Эстэ куда ближе к подножию Игг-Древа, а синие вершины гор, за которыми находилось Благословение, теперь были видны на горизонте."},{"a":"este","b":"krug_eltanir","kind":"внутри","distance":"","source":"ТБ-2 гл.2","quote":"Откуда они проникают в город, находящийся почти в центре Круга, под светом Игг-Древ?"},{"a":"nebo","b":"este","kind":"к_югу_от","distance":"далеко (сотни–тысячи км); Шторм к СВ от Неба","source":"ЗК-6 гл.1","quote":"Если взглянуть на карту Круга, повернув его так, чтобы фригольд Небо стал южной точкой, то Шторм находился далеко на северо-востоке"},{"a":"ozero_devy","b":"este","kind":"к_югу_от","distance":"50–70 км к ЮВ от окраин Шторма","source":"ЗК-6 гл.2","quote":"именно здесь, километрах в пятидесяти-семидесяти к юго-востоку, упала моя капсула, а где-то там, за розовой горной грядой… — озеро и островок"},{"a":"este","b":"ozero_devy","kind":"к_северу_от","distance":"","source":"ЗК-2 гл.9","quote":"Я жил на озере, а вообще к северу там развалины огромного города Кел."},{"a":"ozero_devy","b":"drevo_eltanir","kind":"путь","distance":"Древо на условном севере за снежными горами","source":"ЗК-1 гл.5","quote":"я принял за ориентир Древо, присвоив ему условный «север». Так вот, до величественных гор, над снежными конусами которых возвышался золотой исполин, было очень далеко."},{"a":"strela_burnaya","b":"este","kind":"к_югу_от","distance":"~100 км (Эстэ к СЗ от Стрелы)","source":"ЗК-4 гл.18","quote":"Иглы разрушенного города были отлично видны еще от Стрелы, но все-таки они находились примерно в сотне километров северо-западнее"},{"a":"strela_burnaya","b":"strela_more_trav","kind":"соединено_порталом","distance":"несколько сотен км мгновенно","source":"ЗК-1 гл.12","quote":"узнал приметный трехрогий пик… словно мы одним махом преодолели несколько сотен километров."},{"a":"strela_burnaya","b":"brod_burnoy","kind":"граничит","distance":"","source":"ЗК-1 гл.12","quote":"Если речные рискнут пройти сквозь Стрелу, будет нарушение границы — а это повод к войне."},{"a":"odinoky_pik","b":"strela_more_trav","kind":"путь","distance":"виден от Стрелы","source":"ЗК-1 гл.12","quote":"узнал приметный трехрогий пик и сообразил что вижу те самые горы, что располагались на юге от моего озера"},{"a":"odinoky_pik","b":"ozero_devy","kind":"к_югу_от","distance":"далеко на юг (видны на горизонте)","source":"ЗК-1 гл.12","quote":"те самые горы, что располагались на юге от моего озера"},{"a":"ferma_eirika","b":"strela_more_trav","kind":"путь","distance":"почти день пути верхом","source":"ЗК-6 гл.4","quote":"До фермы от Стрелы почти день пути"},{"a":"ferma_eirika","b":"gory_neba","kind":"к_югу_от","distance":"≈100 миль","source":"ЗК-2 гл.10","quote":"ранчо Эйрика, расположенном в Море Трав милях в ста к югу от наших гор"},{"a":"ferma_eirika","b":"yuzhny_post","kind":"путь","distance":"короткий перелёт винтокрыла","source":"ЗК-5 Интерл. «Травинка»","quote":"вскоре внизу мелькнули сигнальные огни Южного Поста, а затем — прожекторы на сторожевых башнях фермы Эйрика"},{"a":"more_trav","b":"krug_eltanir","kind":"к_западу_от","distance":"~западная половина Круга","source":"ЗК-4 гл.5","quote":"Море Трав, которое, судя по карте, занимало почти всю западную половину Круга, постепенно переходя в теневые области"},{"a":"more_trav","b":"krug_eltanir","kind":"к_югу_от","distance":"","source":"ЗК-4 гл.7","quote":"оно занимало почти всю южную, юго-западную и западную часть Круга, простираясь до теневых земель"},{"a":"pylayushchiy_rog","b":"more_trav","kind":"внутри","distance":"западный край Круга","source":"ЗК-6 гл.9","quote":"Если принять отметку фригольда за условный юг, то вторая — Пылающий Рог — оказалась на западной границе окружности."},{"a":"pylayushchiy_rog","b":"stena_zapad","kind":"граничит","distance":"","source":"ЗК-7 гл.20","quote":"Пылающий Рог был географически удобно расположен, с запада прикрытый Стеной, а с юга и востока — горами и световым кругом Элтанира"},{"a":"more_trav","b":"stena_zapad","kind":"граничит","distance":"","source":"ЗК-6 гл.9","quote":"Море Трав — защищено с двух сторон естественными границами, а третья, западная, как я теперь узнал, прикрыта загадочной Стеной."},{"a":"vladeniya_tavrov","b":"nebo","kind":"к_северу_от","distance":"≈700 км на СЗ","source":"ЗК-4 гл.5","quote":"капсулы упали на северо-западе от нас, в глубине Моря Трав. Около семисот километров по прямой от фригольда"},{"a":"tayushchie_roshchi","b":"ferma_eirika","kind":"к_северу_от","distance":"район падения 50×300 км; перелёт ~480 км","source":"ЗК-4 гл.10","quote":"Местность, куда падали метеоры, находилась на условном северо-востоке от нас… это тоже было Море Трав, но постепенно уходящее к Древнему Лесу."},{"a":"drevny_les","b":"more_trav","kind":"граничит","distance":"","source":"ЗК-4 гл.10","quote":"вытянутый овал в северной оконечности Моря Трав… заходящий на территорию так называемого Древнего Леса — огромного лесного массива, занимающего условный «запад» Круга."},{"a":"drevny_les","b":"este","kind":"к_северу_от","distance":"","source":"ЗК-6 гл.1","quote":"Южнее нас — владения Народа Реки, восточнее и севернее — обширные древние леса, которые считали своими сородичи погибшего Лохмача"},{"a":"zemli_naroda_reki","b":"este","kind":"к_югу_от","distance":"","source":"ЗК-6 гл.1","quote":"Южнее нас — владения Народа Реки"},{"a":"zemli_naroda_reki","b":"krug_eltanir","kind":"к_востоку_от","distance":"восток и юго-восток","source":"ЗК-9 гл.10","quote":"контролировал весьма обширные области речных долин, озер и лесов, занимая условный восток и юго-восток Круга."},{"a":"bolotnye_peshchery","b":"stena_yv","kind":"граничит","distance":"","source":"ЗК-6 гл.3","quote":"Болотных Пещер — неких затопленных тоннелей в исполинской стене на границе Круга"},{"a":"zolotoe_ozero","b":"bolotnye_peshchery","kind":"к_востоку_от","distance":"к СВ","source":"ТБ-1 гл.8","quote":"К северо-востоку от них озерный край принадлежал людям Золотого Озера, теплейшего и крупнейшего водоема в этом Круге."},{"a":"bolota_yv","b":"zemli_naroda_reki","kind":"к_востоку_от","distance":"","source":"ТБ-1 гл.8","quote":"А на юго-востоке до самой Стены простирались бесконечные болота"},{"a":"mertvaya_ryba","b":"bolotnye_peshchery","kind":"к_северу_от","distance":"далеко","source":"ТБ-1 гл.6","quote":"Мертвая Рыба, главный фригольд их клана, находился далеко на севере."},{"a":"este","b":"mertvaya_ryba","kind":"к_северу_от","distance":"за горной грядой","source":"ТБ-1 гл.12","quote":"Форель ведет его на север, к горной гряде, за которой когда-то виднелись башни Эстэ."},{"a":"strela_burnaya","b":"este","kind":"путь","distance":"","source":"ТБ-1 гл.7","quote":"Наконечник Стрелы на утёсе над рекой; за снежными горами — развалины древней столицы Круга (пересказ)"},{"a":"pustoshi_soli","b":"zemli_naroda_reki","kind":"к_югу_от","distance":"","source":"ТБ-1 гл.5","quote":"Далеко на юге, за горами, он видел белесые пустоши Соли и полосу теневых земель."},{"a":"gory_lyudey_gor","b":"nebo","kind":"к_востоку_от","distance":"","source":"ТБ-1 гл.1","quote":"В горных долинах «восточнее» колонии обитали три небольших клана Людей Гор"},{"a":"gory_lyudey_gor","b":"nebo","kind":"к_западу_от","distance":"","source":"ЗК-9 гл.4","quote":"там, к западу от наших владений, обитали разрозненные кланы Народов Гор и Пещер"},{"a":"severnoe_poberezhe","b":"krug_eltanir","kind":"к_северу_от","distance":"","source":"ЗК-4 гл.8","quote":"обитал далеко на севере нашего Круга, населяя побережье и острова. Люди Островов, Народ Моря"},{"a":"svyashchenny_gorod","b":"severnoe_poberezhe","kind":"внутри","distance":"","source":"ЗК-1 гл.15","quote":"один из золотых Восходящих правит Священным Городом на острове в северном море, там есть малый Круг."},{"a":"zapadny_post","b":"nebo","kind":"к_западу_от","distance":"≈25 миль","source":"ЗК-2 гл.12","quote":"Западный Пост находился примерно в двадцати пяти милях от фригольда, на единственной тропе, ведущей со стороны Расколотых Земель."},{"a":"gory_neba","b":"raskolotye_zemli","kind":"граничит","distance":"","source":"ЗК-2 гл.12","quote":"Горная гряда, отданная во владение нашему Народу, была естественной преградой между бесплодной, изборожденной трещинами равниной на краю Круга и Морем Трав"},{"a":"gory_neba","b":"more_trav","kind":"граничит","distance":"","source":"ЗК-2 гл.12","quote":"естественной преградой между… равниной на краю Круга и Морем Трав"},{"a":"rostok_neba","b":"yuzhny_post","kind":"граничит","distance":"","source":"ЗК-6 гл.26","quote":"точка посадки выглядела неплохо — примерно посередине между зданиями фригольда и приснопамятным Южным Постом."},{"a":"zmeiny_kanyon","b":"nebo","kind":"граничит","distance":"","source":"ТБ-1 гл.1","quote":"Змеиный Каньон был естественной границей горного фригольда."},{"a":"zmeiny_kanyon","b":"zapadny_post","kind":"путь","distance":"","source":"ЗК-6 гл.28","quote":"из фригольда туда вела всего одна тропа, заканчивающаяся у знакомой заставы Западного Поста."},{"a":"podkova","b":"nebo","kind":"граничит","distance":"~20 км","source":"ЗК-7 гл.10","quote":"дугообразное плато над Расколотыми Землями в паре десятков км от скальных стен фригольда (пересказ)"},{"a":"raskolotye_zemli","b":"krug_eltanir","kind":"к_югу_от","distance":"","source":"ЗК-6 гл.9","quote":"Они могут прийти только с юга, через Расколотые Равнины, преодолев горные цепи"},{"a":"raskolotye_zemli","b":"zemli_teney","kind":"граничит","distance":"≈300 км Расколотых Земель","source":"ЗК-3 гл.16","quote":"нужно было пересечь всю теневую полосу, а затем триста километров Расколотых Земель."},{"a":"raskolotye_zemli","b":"krug_eltanir","kind":"путь","distance":"2 дня пешком","source":"ЗК-3 гл.4","quote":"До Круга два дня пути, ты сумеешь выбраться"},{"a":"gnezdo_chervey","b":"raskolotye_zemli","kind":"внутри","distance":"~50 км от стоянки рейда","source":"ЗК-3 гл.1","quote":"Гнездо располагалось примерно в полусотне километров от нашей последней стоянки"},{"a":"kolonna_siyaniya","b":"raskolotye_zemli","kind":"внутри","distance":"зона без Рун ~9–10 миль","source":"ЗК-3 гл.7","quote":"Стоило пересечь невидимую границу — по моим прикидкам примерно девять-десять миль от аванпоста, — как совершенно неожиданным образом перестали работать Руны."},{"a":"nebesnye_kogti","b":"raskolotye_zemli","kind":"путь","distance":"200–300 км","source":"ЗК-3 гл.17","quote":"Народ Теней обитал всего в двухстах-трехстах километрах отсюда"},{"a":"zemli_teney","b":"krug_eltanir","kind":"граничит","distance":"","source":"ЗК-9 гл.7","quote":"Географически Земли Теней представляли собой незамкнутое полукольцо, прерванное на условном «севере» морским побережьем."},{"a":"chernaya_past","b":"zemli_teney","kind":"к_югу_от","distance":"","source":"ЗК-9 гл.7","quote":"На севере это океан, на юге — Черная Пасть, возле которой мне довелось побывать, на западе — Стена октагона."},{"a":"cherep_velikana","b":"zemli_teney","kind":"к_востоку_от","distance":"","source":"ТБ-3 гл.9","quote":"Руины древней кел-цитадели глубоко в тенях на восточной оконечности Круга."},{"a":"zemli_lunolikih","b":"zemli_teney","kind":"к_западу_от","distance":"","source":"ЗК-9 гл.5","quote":"Луноликим — могущественной септе Народа Теней, обитающей на северо-западе сумрачной зоны."},{"a":"zemli_lunolikih","b":"pylayushchiy_rog","kind":"к_западу_от","distance":"","source":"ЗК-9 гл.4","quote":"предполагаемое место падения находилось к западу от Пылающего Рога. … Но чуть севернее Луноликие"},{"a":"stena_zapad","b":"krug_eltanir","kind":"граничит","distance":"","source":"ЗК-9 гл.4","quote":"Подобная исполинскому горному хребту Стена рассекала горизонт, древняя и несокрушимая граница октагона, именно в этом месте близко подходя к пределам Круга."},{"a":"chernaya_past","b":"krug_tair","kind":"путь","distance":"≈1500 км Тьмы","source":"ЗК-10 гл.8","quote":"Ближайший к нам Круг Жизни, в самом узком месте отделенный от нашего прослойкой Тьмы всего лишь в полторы тысячи километров."},{"a":"molchanie","b":"chernaya_past","kind":"граничит","distance":"","source":"ТБ-3 гл.10","quote":"Лагеря у Черной Пасти: Молчание (пересказ)"},{"a":"krug_tair","b":"krug_zaov","kind":"путь","distance":"≈18 000 км напрямую; путь караванами","source":"ЗК-10 гл.14","quote":"От Таира до Заова — не очень далеко, если напрямую. Какие-то восемнадцать тысяч километров"},{"a":"karavanny_krug","b":"lazurnoe_oko","kind":"путь","distance":"","source":"ЗК-10 гл.15","quote":"древний путь — от Караванного Круга Таира к Стреле под названием «Лазурное Око»"},{"a":"lazurnoe_oko","b":"krug_zaov","kind":"соединено_порталом","distance":"","source":"ЗК-10 гл.15","quote":"Также ее называли Глазом Заова — пройдя сквозь эту Стрелу, караваны попадали в этот Круг."},{"a":"taelan","b":"krug_zaov","kind":"граничит","distance":"","source":"ЗК-10 гл.20","quote":"Круг Таэлан, по сути, пограничный, мы пересечем по диагонали его окраину, а затем сделаем большой крюк над равнинами Круга Аурантис"},{"a":"serebryanoe_more","b":"krug_zaov","kind":"к_югу_от","distance":"","source":"ЗК-10 гл.20","quote":"кольцом Световых Рек… на условном юге вливающиеся в Серебряное Море"},{"a":"kayr_elis","b":"krug_zaov","kind":"к_северу_от","distance":"","source":"ЗК-10 гл.20","quote":"агрессивный Народ Льда контролировал условный «север» вокруг Кайр’Элис, Ледяного Венца"},{"a":"novaya_zarya","b":"krug_zaov","kind":"к_востоку_от","distance":"юго-восток","source":"ЗК-10 гл.20","quote":"На юго-востоке мерцала золотая маленькая искра — Новая Заря."},{"a":"novaya_zarya","b":"liberti","kind":"путь","distance":"≈300 км (древодень пути)","source":"ЗК-11 гл.19","quote":"находилось совсем недалеко от Либерти (конечно, по меркам Единства — в каких-то трехстах километрах)"},{"a":"liberti","b":"kamennoe_more","kind":"граничит","distance":"≈50 км","source":"ЗК-10 гл.21","quot // ---------- «вне пространства» ----------
function renderCards() {

  ];
  const off = DATA.locations.filter(l => !l.placed);
  const used = new Set();
  groups.forEach(([name, f]) => {
    const items = off.filter(l => !used.has(l.id) && f(l)); if (!items.length) return;
    box.appendChild(h(`<div class="grouph">${esc(name)}</div>`));

// ---------- выбор и панель ----------
function select(id) { state.sel = id; const v = viewOf(id); if (v !== state.view) { state.view = v; history.replaceState(null, "", "#" + v); const conf = VIEWS.find(x => x.id === v); state.base = conf.box; state.vb = conf.box ? conf.box.slice() : null; } render(); showPanel(); if (state.vb) centerOn(id); }

function evHTML(e, hit) { return `<div class="ev${hit ? " hit" : ""}"><div class="h"><span class="code">${esc(e.book)}</span><span class="ch">${esc(e.chapter ? "гл. " + e.chapter : "")}</span></div><div class="t">${esc(e.title)}</div><div class="s">${esc(e.summary)}</div>${e.characters?.length ? `<div class="who">${esc(e.characters.join(", "))}</div>` : ""}</div>`; }
function locLink(id) { const l = byId[id]; return l ? `<button class="loc" data-loc="${esc(id)}">${esc(shortName(l.name))}</button>` : esc(id); }

function showPanel() {

});

// ---------- зум и панорама ----------
function zoom(f, cx, cy) { if (!state.vb) return; const [x, y, w, hh] = state.vb; const nw = Math.min(Math.max(w * f, state.base[2] / 12), state.base[2] * 1.5), nh = nw * hh / w; if (cx === undefined) { cx = x + w / 2; cy = y + hh / 2; } state.vb = [cx - (cx - x) * nw / w, cy - (cy - y) * nh / hh, nw, nh]; setVB(); }
function toMap(ev) { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener("wheel", ev => { ev.preventDefault(); const p = toMap(ev); zoom(ev.deltaY > 0 ? 1.15 : 1 / 1.15, p.x, p.y); }, {passive: false});
let drag = null;
svg.addEventListener("pointerdown", ev => { if (ev.target.closest(".pt, .region")) return; drag = {x: ev.clientX, y: ev.clientY, vb: state.vb.slice(), moved: false}; svg.setPointerCapture(ev.pointerId); svg.classList.add("drag"); });
svg.addEventListener("pointermove", ev => { if (!drag) return; const m = svg.getScreenCTM(); const dx = (ev.clientX - drag.x) / m.a, dy = (ev.clientY - drag.y) / m.d; if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 3) drag.moved = true; state.vb = [drag.vb[0] - dx, drag.vb[1] - dy, drag.vb[2], drag.vb[3]]; setVB(); });
svg.addEventListener("pointerup", ev => { if (drag && !drag.moved && state.sel) { state.sel = null; render(); showPanel(); } drag = null; svg.classList.remove("drag"); });
$("#zin").onclick = () => zoom(1 / 1.4); $("#zout").onclick = () => zoom(1.4); $("#zreset").onclick = () => { state.vb = state.base.slice(); setVB(); };

$("#zterrain").onclick = () => { state.terrain = !state.terrain; try { localStorage.setItem("atlas-terrain", state.terrain ? "1" : "0"); } catch (e) {} const vb = state.vb; render(); state.vb = vb; setVB(); };
$("#noteclose").onclick = () => { state.noteHidden = true; $("#note").hidden = true; };
go(location.hash.slice(1) || "eltanir");
</script>
