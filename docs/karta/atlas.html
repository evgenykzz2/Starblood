<title>Атлас Единства</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: атлас-инструмент — карта слева, «полевой журнал» справа; ночь Единства, золото Древа, синь Звездной Крови */
:root {
  --bg: #0e0c18;          /* ночное небо Единства */
  --surface: #161325;     /* панели */
  --surface-2: #1e1a33;
  --line: #2f2a4a;
  --ink: #ece7f7;
  --ink-2: #b3abcf;
  --ink-3: #8a82a8;
  --gold: #e3b860;        /* свет Игг-Древа, канон */
  --gold-dim: #a8843f;
  --blood: #63c7ec;       /* Звездная Кровь, маршруты */
  --dark: #07060d;        /* Тьма между Кругами */
  --shade: #2a2342;       /* Тени */
  --warn: #e88a6a;
  --font-display: "Cormorant SC", "Cormorant", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
.app { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; height: 100%; min-height: 560px; max-width: 1500px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .04em; margin: 0; color: var(--gold); text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 13px; }
nav.views { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
nav.views button, .chip, .tool {
  font: inherit; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
nav.views button[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); font-weight: 600; }
nav.views button:hover, .chip:hover, .tool:hover { border-color: var(--ink-3); color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blood); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bar .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 2px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; }
.chip[aria-pressed="true"] { background: var(--blood); border-color: var(--blood); color: var(--bg); font-weight: 500; }
.chip.tb[aria-pressed="false"] { border-style: dashed; }
.search { margin-left: auto; display: flex; gap: 6px; min-width: 0; }
.search input { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; width: 210px; max-width: 100%; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; min-height: 0; }
.mapwrap { position: relative; background: var(--dark); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 420px; }
svg.map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
svg.map.drag { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom .tool { background: var(--surface); padding: 4px 9px; font-size: 16px; line-height: 1; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; max-width: calc(100% - 20px); }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }
.viewnote { position: absolute; left: 10px; top: 10px; max-width: min(460px, calc(100% - 70px)); font-size: 12px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
aside.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: auto; padding: 14px 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0 0 2px; color: var(--ink); line-height: 1.15; text-wrap: balance; }
.panel h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; font-weight: 600; }
.panel p { margin: 6px 0; color: var(--ink-2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--ink-2); }
.pill.canon { border-color: var(--gold-dim); color: var(--gold); }
.pill.guess { border-style: dashed; color: var(--warn); border-color: var(--warn); }
.pill.rumor { border-style: dotted; color: var(--ink-3); }
.ev { border-left: 2px solid var(--line); padding: 4px 0 6px 10px; margin: 6px 0; }
.ev.hit { border-left-color: var(--blood); }
.ev .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ev .code { font-family: var(--font-mono); font-size: 12px; color: var(--blood); }
.ev .ch { font-size: 12px; color: var(--ink-3); }
.ev .t { font-weight: 600; color: var(--ink); }
.ev .s { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.ev .who { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.rel { font-size: 13px; color: var(--ink-2); margin: 6px 0; }
.rel q { display: block; color: var(--ink-3); font-style: italic; margin-top: 2px; quotes: "«" "»"; }
a.loc, button.loc { color: var(--gold); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--gold) 40%, transparent); text-underline-offset: 2px; }
ol.route { padding-left: 20px; margin: 6px 0; }
ol.route li { margin: 2px 0; color: var(--ink-2); }
ol.route li .off { color: var(--ink-3); font-size: 12px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stat div { background: var(--surface-2); border-radius: 8px; padding: 8px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 14px; overflow: auto; height: 100%; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
.card:hover { border-color: var(--ink-3); }
.card .n { font-weight: 600; }
.card .d { color: var(--ink-3); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .e { font-family: var(--font-mono); font-size: 11px; color: var(--blood); margin-top: 4px; }
.grouph { grid-column: 1 / -1; font-family: var(--font-display); font-size: 20px; color: var(--gold); margin: 6px 0 -2px; }
.results { display: grid; gap: 2px; margin: 4px 0; }
/* SVG */
.lbl-region { font-family: var(--font-display); font-weight: 600; letter-spacing: .12em; fill: var(--ink-2); text-anchor: middle; pointer-events: none; }
.lbl-point { font-family: var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--dark); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.lbl-point.minor { fill: var(--ink-2); }
svg.z2 .lbl-point.lv2, svg.z3 .lbl-point.lv3 { display: none; }
.pt:hover .lbl-point, .pt.sel .lbl-point, .pt:focus-visible .lbl-point { display: inline !important; fill: var(--ink); }
.lbl-note { font-family: var(--font-body); fill: var(--ink-3); font-style: italic; text-anchor: middle; pointer-events: none; }
.pt { cursor: pointer; }
.pt circle.m { fill: var(--surface-2); stroke: var(--ink-2); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.pt.has circle.m { fill: var(--gold); stroke: #fff3d6; }
.pt.guess circle.m { stroke-dasharray: 3 2; }
.pt.dim { opacity: .22; }
.pt.sel circle.ring { stroke: var(--blood); stroke-width: 2.5px; fill: none; vector-effect: non-scaling-stroke; }
.pt:hover circle.m { stroke: var(--blood); }
.region { cursor: pointer; }
.region ellipse { fill: var(--ink); fill-opacity: .045; stroke: var(--ink-3); stroke-opacity: .35; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
.region:hover ellipse, .region.sel ellipse { fill-opacity: .09; stroke: var(--blood); stroke-opacity: .8; }
.route path { fill: none; stroke: var(--blood); stroke-width: 2.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.route .step { fill: var(--bg); stroke: var(--blood); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.route text { font-family: var(--font-mono); fill: var(--blood); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.allroutes path { fill: none; stroke: var(--blood); stroke-opacity: .16; stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
@media (max-width: 900px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .mapwrap { height: 70vh; min-height: 380px; }
  aside.panel { max-height: none; }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; }
  nav.views { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .pt circle.m, .region ellipse { transition: stroke .15s, fill-opacity .15s; } }
</style>

<div class="app">
  <header class="top">
    <h1>Атлас Единства</h1>
    <span class="sub">Карта мест и событий «Звездной Крови» и «Тысячи Братьев» Романа Прокофьева</span>
    <nav class="views" aria-label="Уровень карты" id="views"></nav>
  </header>
  <div class="bar" id="bar">
    <span class="lbl">Книга</span>
    <span id="chips" class="bar"></span>
    <div class="search"><input id="q" type="search" placeholder="Найти место…" aria-label="Найти место" autocomplete="off"></div>
  </div>
  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карта"></svg>
      <div class="cards" id="cards" hidden></div>
      <div class="viewnote" id="note"><span id="notetext"></span> <button class="loc" id="noteclose" aria-label="Скрыть пояснение">скрыть</button></div>
      <div class="zoom" id="zoomctl">
        <button class="tool" id="zin" aria-label="Приблизить">+</button>
        <button class="tool" id="zout" aria-label="Отдалить">−</button>
        <button class="tool" id="zreset" aria-label="Показать всю карту">⤢</button>
      </div>
      <div class="legend" id="legend">
        <div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--gold)" stroke="#fff3d6"/></svg>место с событиями (размер — число событий)</div>
        <div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="var(--surface-2)" stroke="var(--ink-2)"/></svg>место без отмеченных событий</div>
        <div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="none" stroke="var(--ink-2)" stroke-dasharray="3 2"/></svg>положение условное (в книгах не указано)</div>
        <div class="row"><svg width="22" height="10"><path d="M1 5 H21" stroke="var(--blood)" stroke-width="2.5"/></svg>маршрут героя выбранной книги</div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
const DATA = {"locations":[{"id":"kosmos","name":"Космос вне Единства","type":"космос","parent":null,"desc":"Внешнее пространство: настоящие звёзды, «осколки черных лун» и пояс камней вокруг дайсон-сферы. Сюда выбрасывает Псов Вечности через Брешь.","peoples":[],"terrain":"вакуум, абсолютный холод","first":"TB-04 Интерлюдия «Брешь»","xd":false,"cert":"канон","placed":true},{"id":"zemlya","name":"Земля / Солнечная система","type":"планета","parent":"kosmos","desc":"Родина колонистов (Большая Евразия, Аркто-Пацифика, Новая Аркона, Нео-Мумбаи, Мир-Кольцо как земная мегаструктура). Минос: Единство стоит на месте Солнечной системы, Солнце превратилось в чёрную дыру («шесть оборотов галактики»). Тождество «Земля = место Единства» — гипотеза героев.","peoples":["люди (земляне)"],"terrain":"","first":"SK-01 Интерлюдия «Хельга»","xd":false,"cert":"канон / частично гипотеза","placed":true},{"id":"a_prostranstvo","name":"А-пространство","type":"внепространство","parent":"kosmos","desc":"«Синяя бездна», через которую шёл ковчег; при выходе — «вспышка Грани». Связано с А-энергией (основа Звёздной Крови и Рун).","peoples":[],"terrain":"","first":"SK-01 Интерлюдия «Хельга»","xd":true,"cert":"канон","placed":true},{"id":"edinstvo","name":"Единство (дайсон-сфера)","type":"мегаструктура","parent":"kosmos","desc":"Сплошная сфера Дайсона диаметром ≈2,5 а.е. (граница между орбитами Земли и Марса), построенная Кел вокруг звезды, ставшей чёрной дырой. Обитаема ВНУТРЕННЯЯ поверхность: «площадь в сотни миллионов раз больше Земли», десятки тысяч Кругов. Поверхность разбита иллиумовым каркасом на «бесчисленные» октагоны, разделённые Великими Стенами; на стыках — Башни. Горизонт не обрывается, а «поднимается» слоями. Над головой — Небесный Трон (центр сферы).","peoples":["Кел (ушли в Вечность)","десятки Народов, «триллионы разумных»"],"terrain":"внутренняя поверхность сферы: Круги Жизни под Игг-Древами, Тень, Тьма","first":"SK-01 гл.23","xd":false,"cert":"канон","placed":true},{"id":"obolochka","name":"Оболочка и «кости Единства»","type":"оболочка","parent":"edinstvo","desc":"Многослойная иллиумовая броня сферы с «глубинными горизонтами» и полыми ходами (жилы воды, небесного огня, воздуха, подземные пути). Снаружи — Великие Инскрипции размером с октагон (голубые и изумрудные защитные знаки). Под Эстэ герои спускаются к «костям Единства» (сферический зал Строителей).","peoples":[],"terrain":"иллиум, подземные горизонты, Логова Червей","first":"SK-04 Пролог; TB-02 гл.3; TB-04 Интерл. «Брешь»","xd":false,"cert":"канон","placed":true},{"id":"bresh","name":"Брешь","type":"пролом","parent":"obolochka","desc":"Разлом в оболочке дайсон-сферы, «затянутый мерцающей пленкой»; у оплавленных краёв — огоньки дрейф-цитаделей Ордена Истинных. Защитник (Тот-Кто-Сражается) нёс здесь вечный дозор. Из сферы наружу выйти можно, вернуться минуя Брешь — нельзя.","peoples":["Орден Истинных"],"terrain":"","first":"SK-02 Пролог; SK-08 гл.12; TB-04 Интерл. «Брешь»","xd":false,"cert":"канон","placed":true},{"id":"al_minastir","name":"Аль-Минастир","type":"дрейф-цитадель","parent":"bresh","desc":"Дрейф-цитадель Ордена Истинных: золотая «корона» в облачной толще у Бреши («Ты у проломленных врат Единства. Здесь мы несем свой дозор»). Кольцо подобных цитаделей; вдали — «сломанные кости Единства».","peoples":["Орден Истинных","Тайновидица"],"terrain":"","first":"SK-08 гл.12","xd":false,"cert":"канон","placed":true},{"id":"nebesny_tron","name":"Небесный Трон (диск аккреции)","type":"астрообъект","parent":"edinstvo","desc":"Астроинженерная крепость вокруг чёрной дыры в центре сферы; виден как «синяя игла»/«голубое веретено» днём и «око Вечности» (овал, пронзённый иглой) ночью; смена его формы = смена Знака небесного календаря. Даёт вторую тень; ночной свет.","peoples":[],"terrain":"чёрная дыра, диск аккреции, релятивистские струи","first":"SK-01 гл.1 (как «солнце-веретено»); SK-03 Аннотация","xd":false,"cert":"канон","placed":true},{"id":"vechnost","name":"Вечность","type":"иное измерение","parent":"nebesny_tron","desc":"«Загробный мир» избранных Восходящих внутри Небесного Трона; мультиверсум из тысяч миров, «разросшийся из копии дайсон-сферы». Правят 7 Хранителей Вечности, Дома Кел. Вход — смерть со стигматом, Бассейны Душ, нити-аватары, Храмы Вечности.","peoples":["Кел-нео","Хранители Вечности","Дома: Норн, Вортекс, Темные Звезды, Эррос, Ноктис…","Ковенант"],"terrain":"","first":"SK-01 гл.8; SK-05 гл.5","xd":true,"cert":"канон","placed":true},{"id":"kamni","name":"Камни (мир-осколок)","type":"мир","parent":"vechnost","desc":"Мир-осколок с колонией рудокопов; первая точка выхода отражения Сигурда, золотые комары-стражи; до Врат ~300 км.","peoples":[],"terrain":"","first":"SK-05 гл.6","xd":true,"cert":"канон","placed":false},{"id":"zolotoy_gorod","name":"Золотой Город","type":"город","parent":"vechnost","desc":"Столица Вечности: голубое небо, солнце как земное, нет Игг-Древа; платформа Врат (12+ арок), диски-острова в мили диаметром вокруг золотого столпа; город-зиккурат из террас «занимает целый октагон (≈ средний Круг Жизни)». Калька с прежней столицы Единства.","peoples":["Кел-нео","Ковенант","Контракция"],"terrain":"","first":"SK-02 гл.19","xd":true,"cert":"канон","placed":false},{"id":"dom_kubkov","name":"Дом (Дворец) Кубков и Храм Наслаждений","type":"квартал","parent":"zolotoy_gorod","desc":"Увеселительные заведения Золотого Города; у Дома Кубков — арка-портал в Тёмное.","peoples":[],"terrain":"","first":"SK-05 гл.10–11","xd":true,"cert":"канон","placed":false},{"id":"temnoe","name":"Тёмное","type":"домен","parent":"zolotoy_gorod","desc":"Теневая «изнанка» Золотого Города, отдельный Домен без узлов небесной сети; контрактории, покровительство Хитрейшего.","peoples":[],"terrain":"","first":"SK-06 гл.14","xd":true,"cert":"канон","placed":false},{"id":"nebesnye_terrasy","name":"Небесные Террасы","type":"квартал","parent":"zolotoy_gorod","desc":"Аристократический квартал над облаками, представительства великих Домов (Вортекс и др.).","peoples":[ ","xd":true,"cert":"канон","placed":true},{"id":"hram_pervogo_shaga","name":"Храм Первого Шага","type":"храм","parent":"serebryany_zamok","desc":"Руна-Башня, «малая экстрамерность» для испытаний бронзы (цилиндрический колодец, зелёный свет). Вход из Домена.","peoples":[],"terrain":"","first":"SK-05 гл.4","xd":true,"cert":"канон","placed":false},{"id":"hram_vtorogo_shaga","name":"Храм Второго Шага (Лабиринт)","type":"храм","parent":"edinstvo","desc":"Испытание серебра: спиральная лестница вниз, Испытание Воли.","peoples":[],"terrain":"","first":"SK-08 гл.11","xd":true,"cert":"канон","placed":false},{"id":"hram_tretego_shaga","name":"Храм (Обитель) Третьего Шага","type":"храм","parent":"edinstvo","desc":"Испытание золота; лишь упоминается.","peoples":[],"terrain":"","first":"SK-08 гл.11","xd":true,"cert":"канон","placed":false},{"id":"serebryany_zamok","name":"Серебряный Замок","type":"домен","parent":"edinstvo","desc":"Домен Азимандии Визу Аран, затем — Сигурда и колонии Небо: сиреневое небо с галактиками, шпили, водопад, изумрудный сад, остров-лаборатория над бездной (кости жертв), зал Саркофагов, Реликварий Кейнора. Вход — озерцо у тропы (кристалл-стражи). Ядро (кристалл-сфера в иллиумовой оковке) — в склепе в мёртвых «тёмных землях» за Стрелой Домена.","peoples":["кел Визу Аран","земляне (лаборатория Миноса)"],"terrain":"","first":"SK-02 гл.18","xd":true,"cert":"канон","placed":false},{"id":"kriptа_yadra_zamka","name":"Склеп ядра Серебряного Замка","type":"склеп","parent":"temnye_zemli","desc":"Изолированная камера (−77 °C) в мёртвых октагонах, где в столбе вмурована кристалл-сфера Домена («яйцо кощеево»).","peoples":[],"terrain":"","first":"SK-08 гл.2–3","xd":false,"cert":"канон","placed":false},{"id":"ostrov_trav","name":"Остров Трав","type":"домен","parent":"edinstvo","desc":"Домен Говорящей-с-Травами: треугольный остров в пустоте (~футбольное поле), серое светящееся небо, хижина Винсента, плантация трав, «стрела Переноса». Начальная стадия Домена. Кристалл-сфера позже в лаборатории Неба.","peoples":["Говорящая-с-Травами"],"terrain":"","first":"SK-05 гл.? (упом.); SK-06 гл.25","xd":true,"cert":"канон","placed":false},{"id":"razbitaya_skrizhal","name":"Домен-Сокровище «Разбитая Скрижаль» (Домен Белого Дьявола)","type":"домен","parent":"edinstvo","desc":"Семь платформ золотого лиора, мосты застывшего света, призрак-хранитель Архитектор. Стрела Домена ведёт к Башне Молний; кристалл-сфера — на вершине Башни Молний. В SK-10 повышен до золота (площадь ×64).","peoples":[],"terrain":"","first":"TB-03 гл.2","xd":true,"cert":"канон","placed":false},{"id":"ergial","name":"Ледяные Чертоги Эргиаля","type":"цитадель-домен","parent":"ledyanaya_bezdna","desc":"Древний Домен Ледяного Кузнеца (Кейнор), «приземлённый» в Ледяной Бездне: город из звёздного льда, лед-кузнецы, Чертог Пробуждения, башня Кузнеца с троном. «В Эргиаль можно войти, но нельзя выйти». ~100 млн км от фригольда Небо (по Скай). Наполовину разрушен в битве с Гармонией.","peoples":["лед-кузнецы","криархи","великаны-айсгарды"],"terrain":"звёздный лёд, ледяные разломы, −37 °C","first":"SK-02 гл.? (упом.); SK-08 гл.19; TB-02 Аннотация","xd":false,"cert":"канон","placed":true},{"id":"hartlend","name":"Хартленд Корпуса (Хранилища Ноктис)","type":"домен","parent":"edinstvo","desc":"Подземные/экстрамерные хранилища дома Ноктис (Корпус наёмников): арсеналы, доспехи Кор Ноктис в столбах остановленного времени. Вход по Ключу Оноры.","peoples":[],"terrain":"","first":"SK-08 гл.17–18","xd":true,"cert":"канон","placed":false},{"id":"proklyatoe_svyatilishche","name":"Проклятое Святилище (Руна-Арена)","type":"арена","parent":"edinstvo","desc":"Рунная арена поединков Восходящих; чемпион Орин (Народ Огня). Перенос по вызову.","peoples":[],"terrain":"","first":"TB-01 гл.17","xd":true,"cert":"канон","placed":false},{"id":"perekrestok","name":"Перекрёсток Великих Караванов","type":"домен","parent":"edinstvo","desc":"Домен — каменное колесо в пустоте: ступица Камень Странника, спицы-дороги, не озером), Ствол, Ветви первого яруса, Солнечная Ветвь; Золотые Термиты, Игг-Смола. Источник дневного света Круга.","peoples":["Народ Древа (Люди Ветвей)","Хранители Древа (Золотые Стрекозы)"],"terrain":"","first":"SK-01 гл.1","xd":false,"cert":"канон","placed":true},{"id":"blagoslovenie","name":"Земли Благословения","type":"регион","parent":"krug_eltanir","desc":"Сердце Круга вокруг Великого Древа: «нет преступлений, невозможны убийства и войны». С севера подходит залив; границы — горная гряда (синие горы) с каскадом водопадов; входы — «стокилометровые прорехи» (Западный Проход, южные врата). В Дикую Охоту границы закрываются. Владычица — Иниэсс Зелёный Лист (кинг Народа Древа).","peoples":["Народ Древа"],"terrain":"золотые рощи, озеро у корней","first":"SK-01 гл.22","xd":false,"cert":"канон","placed":true},{"id":"tingvellir","name":"Тингвеллир","type":"святилище","parent":"blagoslovenie","desc":"Место тинга у основания Ствола: черно-золотой корень-эстакада к арке, амфитеатр на десятки тысяч мест, круги-трибуны Народов, овальная арена фионтаров.","peoples":[],"terrain":"","first":"SK-06 гл.20","xd":false,"cert":"канон","placed":true},{"id":"zaliv_blagosloveniya","name":"Залив Благословения","type":"залив","parent":"krug_eltanir","desc":"Залив, подходящий к Благословению с севера.","peoples":[],"terrain":"","first":"SK-06 гл.10","xd":false,"cert":"канон","placed":true},{"id":"sinie_gory","name":"Синие горы (гряда Благословения)","type":"горы","parent":"krug_eltanir","desc":"Горная стена вокруг Благословения; река прорезает её «исполинским каскадом водопадов» — «одно из чудес нашего Круга». Видны из Эстэ.","peoples":[],"terrain":"","first":"SK-06 гл.26; TB-04 гл.9","xd":false,"cert":"канон","placed":true},{"id":"zapadny_prohod","name":"Западный Проход","type":"перевал","parent":"krug_eltanir","desc":"Холмистый край с рощами золотых деревьев между Морем Трав и Благословением — «стокилометровая прореха» в горах.","peoples":[],"terrain":"","first":"SK-06 гл.10","xd":false,"cert":"канон","placed":true},{"id":"yuzhnye_vrata","name":"Южные горные врата Благословения","type":"перевал","parent":"krug_eltanir","desc":"Путь, которым земляне обычно ходят к Древу.","peoples":[],"terrain":"","first":"SK-06 гл.10, гл.26","xd":false,"cert":"канон","placed":true},{"id":"more_trav","name":"Море Трав","type":"регион","parent":"krug_eltanir","desc":"Бескрайняя желто-зелёная степь, трава выше человеческого роста, холмы и рощи. По разным местам — «почти вся западная половина Круга» / «южная, юго-западная и западная часть», переходит в теневые земли; с запада прикрыто Стеной октагона. Земли Народа Трав, тавров, шёлковых птиц, тауро.","peoples":["Народ Трав (эль)","тавры (дикие быколюди)"],"terrain":"степь, рощи, холмы","first":"SK-01 гл.12","xd":false,"cert":"канон","placed":true},{"id":"pylayushchiy_rog","name":"Пылающий Рог","type":"древо","parent":"more_trav","desc":"Одно из трёх Малых Древ Круга, молодое (не даёт Семян); столица Народа Трав; рядом купольные гарнизон-капсулы Наблюдателя. На западной границе Круга, «в сердце степей»; с запада прикрыт Стеной, с юга и востока — горами.","peoples":["Народ Трав"],"terrain":"","first":"SK-01 гл.14","xd":false,"cert":"канон","placed":true},{"id":"ferma_eirika","name":"Ферма (ранчо) Эйрика","type":"ферма","parent":"more_trav","desc":"Укреплённое ранчо Эйрика в Море Трав «милях в ста к югу от наших гор»; тауро, шёлковые птицы, цезари; сторожевые башни. От Стрелы — «почти день пути». Позже Эйрик переселяется на плато Неба.","peoples":["Народ Земли","нордийцы (жёны Эйрика)"],"terrain":"","first":"SK-02 гл.10","xd":false,"cert":"канон","placed":true},{"id":"strela_more_trav","name":"Стрела (выход в Море Трав)","type":"портал","parent":"more_trav","desc":"Конец древнего транслокатора Кел в земле Народа Трав; отсюда виден «приметный трёхрогий пик».","peoples":[],"terrain":"","first":"SK-01 гл.12","xd":false,"cert":"канон","placed":true},{"id":"strela_burnaya","name":"Стрела у Бурной («Наконечник Стрелы»)","type":"портал","parent":"ozerny_kray","desc":"Конец Стрелы на утёсе над рекой у брода, ~100 км юго-восточнее Эстэ; граница прохода Народа Реки.","peoples":[],"terrain":"","first":"SK-01 гл.12; TB-01 гл.7","xd":false,"cert":"канон","placed":true},{"id":"odinoky_pik","name":"Одинокий Пик (трёхрогая гора)","type":"гора","parent":"more_trav","desc":"Трёхрогий пик в Море Трав; место Печати Единства, куда помещают филактерию Зелвана Пожирателя; логово орды тавров.","peoples":[],"terrain":"","first":"SK-01 гл.12 (как «трёхрогий пик»); SK-07 гл.3","xd":false,"cert":"канон","placed":true},{"id":"vladeniya_tavrov","name":"Ничейные земли тавров","type":"регион","parent":"more_trav","desc":"Охотничьи угодья Народа Трав, фактически — табуны диких тавров; место первого рейда за капсулами (~700 км к северо-западу от Неба).","peoples":[],"terrain":"","first":"SK-04 гл.5","xd":false,"cert":"канон","placed":true},{"id":"tayushchie_roshchi","name":"Тающие Рощи","type":"лес","parent":"more_trav","desc":"Рощи деревьев-фабрик нанотрубок с парящими листьями и полярами; место засады изгоев Кнута.","peoples":[],"terrain":"","first":"SK-04 гл.11","xd":false,"cert":"канон","placed":true},{"id":"drevny_les","name":"Древний Лес","type":"лес","parent":"krug_eltanir","desc":"Огромный лесной массив; по SK-04 — «условный запад» Круга, по SK-06 — восточнее и севернее Шторма (противоречие).","peoples":["Народ Леса","Народ Камня"],"terrain":"","first":"SK-04 гл.10","xd":false,"cert":"канон","placed":true},{"id":"ozerny_kray","name":"Озёрный край / запретная зона Эстэ","type":"регион","parent":"krug_eltanir","desc":"Лесной край к северу от гор: сине-голубые «геометрические» леса, дедары, руины. Алый круг запретной зоны Наблюдателя очерчен по границе Стражей Эстэ — здесь Руны Кел сбили капсулу Сигурда.","peoples":["(необитаем; рядом Люди Реки)"],"terrain":"лес, озёра, розовые гранитные скалы","first":"SK-01 гл.1; SK-04 гл.10","xd":false,"cert":"канон","placed":true},{"id":"ozero_devy","name":"Озеро Девы","ty еребряного лиора, Око Наблюдателя; кристалл-сфера его Домена на обломанной вершине. Место гибели Всполох (TB-04).","peoples":[],"terrain":"","first":"SK-04 гл.21; SK-08 гл.17","xd":false,"cert":"канон","placed":true},{"id":"shpili_este","name":"Шпили-Стражи и Мечи Эстэ","type":"укрепления","parent":"este","desc":"12 Шпилей, каждый хранил Меч жёсткого света; по их границе Наблюдатель прочертил запретную зону.","peoples":[],"terrain":"","first":"TB-01 гл.12, гл.14","xd":false,"cert":"канон","placed":true},{"id":"stancii_este","name":"Станции транслокации Эстэ","type":"узлы","parent":"este","desc":"Знак Переноса открывает: Башня Изобилия, Сфера Небесной Энергии, Великий Архив Снов; Купол Вознесения (место падения Небесного Ястреба). Позже — Кузницы Света, Архив Забвения, Дом Стрелков.","peoples":[],"terrain":"","first":"SK-04 гл.19–20; TB-04 гл.2–3","xd":false,"cert":"канон","placed":true},{"id":"ubezhishche","name":"Убежище изгоев (Шторм)","type":"лагерь","parent":"este","desc":"Подземный зал-резиденция Кнута (Ларссона) в руинах Шторма, личный Портал; точка эвакуации экспедиций.","peoples":["изгои"],"terrain":"","first":"SK-05 гл.19; SK-06 гл.1","xd":false,"cert":"канон","placed":true},{"id":"zemli_naroda_reki","name":"Земли Народа Реки","type":"регион","parent":"krug_eltanir","desc":"Речные долины, озёра, леса и болота «условного востока и юго-востока Круга»; один из четырёх крупнейших Народов. Кланы: Мёртвая Рыба, Болотные Пещеры, Тростник, Холодное Озеро/Холодные Воды, Золотое Озеро.","peoples":["Народ Реки (речники)"],"terrain":"","first":"SK-01 гл.10; SK-06 гл.3","xd":false,"cert":"канон","placed":true},{"id":"mertvaya_ryba","name":"Мёртвая Рыба","type":"фригольд","parent":"zemli_naroda_reki","desc":"Крупнейший фригольд Людей Реки в скелете чудовищной рыбы посреди реки (рёбра — стены, водопад сквозь пасть). Рикс Аурвак Владыка Чешуи. К югу от гряды, за которой Эстэ.","peoples":["Народ Реки"],"terrain":"","first":"SK-01 гл.10; TB-01 гл.7","xd":false,"cert":"канон","placed":true},{"id":"bolotnye_peshchery","name":"Болотные Пещеры","type":"поселение","parent":"zemli_naroda_reki","desc":"Клан Людей Реки: «затопленные тоннели в исполинской стене на границе Круга»; уничтожен фроггами в Дикую Охоту.","peoples":[],"terrain":"","first":"SK-06 гл.3; TB-01 гл.8–10","xd":false,"cert":"канон","placed":true},{"id":"zolotoe_ozero","name":"Золотое Озеро","type":"озеро","parent":"zemli_naroda_reki","desc":"«Теплейший и крупнейший водоём в этом Круге»; озёрный край к северо-востоку от земель Болотных Пещер.","peoples":[],"terrain":"","first":"TB-01 гл.8","xd":false,"cert":"канон","placed":true},{"id":"bolota_yv","name":"Болота юго-востока","type":"болото","parent":"zemli_naroda_reki","desc":"«На юго-востоке до самой Стены простирались бесконечные болота».","peoples":[],"terrain":"","first":"TB-01 гл.8","xd":false,"cert":"канон","placed":true},{"id":"zabytye_ozera","name":"Озеро локи («Забытые Озёра»)","type":"озеро","parent":"zemli_naroda_reki","desc":"Озеро с локи; Белый Дьявол открыл на дне Портал «Забытые Озёра».","peoples":[],"terrain":"","first":"TB-01 гл.13","xd":false,"cert":"канон (точная локализация неизвестна)","placed":true},{"id":"severnoe_poberezhe","name":"Северное побережье и острова (Народ Моря)","type":"регион","parent":"krug_eltanir","desc":"«Далеко на севере нашего Круга» — побережье и острова нордийцев; карта неизвестна. По слухам, на острове в северном море — Священный Город золотого Восходящего с малым Кругом.","peoples":["нордийцы (Народ Моря, Люди Островов)"],"terrain":"","first":"SK-01 гл.15; SK-04 гл.8","xd":false,"cert":"канон","placed":true},{"id":"svyashchenny_gorod","name":"Священный Город","type":"город","parent":"severnoe_poberezhe","desc":"Слух нордалов: город на острове в северном море, правит золотой Восходящий, «там есть малый Круг».","peoples":[],"terrain":"","first":"SK-01 гл.15","xd":false,"cert":"слух","placed":true},{"id":"gory_neba","name":"Ничейные горы (горный массив Неба)","type":"горы","parent":" лоской картой Земли, освещена была едва ли половина Евразии."},{"a":"zemli_teney","b":"oktagon_eltanir","kind":"внутри","distance":"","source":"SK-11 гл.21","quote":"Круг касался теневым кольцом лишь западной грани — той, где прежде жили Луноликие и находилась Язва."},{"a":"severnoe_poberezhe","b":"oktagon_eltanir","kind":"к_северу_от","distance":"","source":"SK-11 гл.21","quote":"Северная часть — обрывалась в морском просторе, южная — была пересечена Черной Пастью, а практически весь восток — поглощен темными зонами."},{"a":"yz_bashnya","b":"krug_eltanir","kind":"к_югу_от","distance":"юго-запад","source":"SK-11 гл.21","quote":"Ближайшая Башня должна находиться на юго-западе, и именно к ней устремилась Голубая Стрела."},{"a":"ergial","b":"nebo","kind":"путь","distance":"≈100 млн км","source":"SK-08 гл.18","quote":"Примерное расстояние до фригольда Небо — порядка ста миллионов километров."},{"a":"helga","b":"krug_eltanir","kind":"путь","distance":"","source":"SK-04 гл.10","quote":"ковчег, не выходя на связь и не отвечая на вызовы, двигался по повторяющейся траектории над несколькими Кругами"},{"a":"drevo_eltanir","b":"krug_eltanir","kind":"внутри","distance":"центр Круга","source":"SK-04 гл.5","quote":"Если представить Древо центром, а наш фригольд — крайней южной точкой"},{"a":"nebo","b":"krug_eltanir","kind":"к_югу_от","distance":"крайний юг (условно)","source":"SK-04 гл.5","quote":"Если представить Древо центром, а наш фригольд — крайней южной точкой"},{"a":"zaliv_blagosloveniya","b":"blagoslovenie","kind":"к_северу_от","distance":"","source":"SK-06 гл.10","quote":"Я знал, что с севера к области Благословения подходит залив"},{"a":"zapadny_prohod","b":"blagoslovenie","kind":"к_западу_от","distance":"прореха ~100 км","source":"SK-06 гл.10","quote":"Одна из таких стокилометровых прорех как раз находилась на западе — врата из Моря Трав в так называемое Благословение"},{"a":"zapadny_prohod","b":"more_trav","kind":"граничит","distance":"","source":"SK-06 гл.10","quote":"Западный Проход — холмистый край между Морем Трав и Благословением"},{"a":"yuzhnye_vrata","b":"blagoslovenie","kind":"к_югу_от","distance":"","source":"SK-06 гл.10","quote":"земляне в основном использовали другие, южные врата"},{"a":"sinie_gory","b":"blagoslovenie","kind":"граничит","distance":"","source":"SK-06 гл.26","quote":"синюю ленту реки, проходящую сквозь нее исполинским… каскадом водопадов, — одно из чудес нашего Круга и естественную границу Благословения"},{"a":"este","b":"blagoslovenie","kind":"граничит","distance":"за горами","source":"TB-04 гл.9","quote":"Эстэ куда ближе к подножию Игг-Древа, а синие вершины гор, за которыми находилось Благословение, теперь были видны на горизонте."},{"a":"este","b":"krug_eltanir","kind":"внутри","distance":"","source":"TB-02 гл.2","quote":"Откуда они проникают в город, находящийся почти в центре Круга, под светом Игг-Древ?"},{"a":"nebo","b":"este","kind":"к_югу_от","distance":"далеко (сотни–тысячи км); Шторм к СВ от Неба","source":"SK-06 гл.1","quote":"Если взглянуть на карту Круга, повернув его так, чтобы фригольд Небо стал южной точкой, то Шторм находился далеко на северо-востоке"},{"a":"ozero_devy","b":"este","kind":"к_югу_от","distance":"50–70 км к ЮВ от окраин Шторма","source":"SK-06 гл.2","quote":"именно здесь, километрах в пятидесяти-семидесяти к юго-востоку, упала моя капсула, а где-то там, за розовой горной грядой… — озеро и островок"},{"a":"este","b":"ozero_devy","kind":"к_северу_от","distance":"","source":"SK-02 гл.9","quote":"Я жил на озере, а вообще к северу там развалины огромного города Кел."},{"a":"ozero_devy","b":"drevo_eltanir","kind":"путь","distance":"Древо на условном севере за снежными горами","source":"SK-01 гл.5","quote":"я принял за ориентир Древо, присвоив ему условный «север». Так вот, до величественных гор, над снежными конусами которых возвышался золотой исполин, было очень далеко."},{"a":"strela_burnaya","b":"este","kind":"к_югу_от","distance":"~100 км (Эстэ к СЗ от Стрелы)","source":"SK-04 гл.18","quote":"Иглы разрушенного города были отлично видны еще от Стрелы, но все-таки они находились примерно в сотне километров северо-западнее"},{"a":"strela_burnaya","b":"strela_more_trav","kind":"соединено_порталом","distance":"несколько сотен км мгновенно","source":"SK-01 гл.12","quote":"узнал приметный трехрогий пик… словно мы одним махом преодолели несколько сотен километров."},{"a":"strela_burnaya","b":"brod_burnoy","kind":"граничит","distance":"","source":"SK-01 гл.12","quote":"Если речные рискнут пройти сквозь Стрелу, будет нарушение границы — а это повод к войне."},{"a":"odinoky_pik","b":"strela_more_trav","kind":"путь","distance":"виден от Стрелы","source":"SK-01 гл.12","quote":"узнал приметный трехрогий пик и сообразил что вижу те самые горы, что располагались на юге от моего озера"},{"a":"odinoky_pik","b":"ozero_devy","kind":"к_югу_от","distance":"далеко на юг (видны на горизонте)","source":"SK-01 гл.12","quote":"те самые горы, что располагались на юге от моего озера"},{"a":"ferma_eirika","b":"strela_more_trav","kind":"путь","distance":"почти день пути верхом","source":"SK-06 гл.4","quote":"До фермы от Стрелы почти день пути"},{"a":"ferma_eirika","b":"gory_neba","kind":"к_югу_от","distance":"≈100 миль","source":"SK-02 гл.10","quote":"ранчо Эйрика, расположенном в Море Трав милях в ста к югу от наших гор"},{"a":"ferma_eirika","b":"yuzhny_post","kind":"путь","distance":"короткий перелёт винтокрыла","source":"SK-05 Интерл. «Травинка»","quote":"вскоре внизу мелькнули сигнальные огни Южного Поста, а затем — прожекторы на сторожевых башнях фермы Эйрика"},{"a":"more_trav","b":"krug_eltanir","kind":"к_западу_от","distance":"~западная половина Круга","source":"SK-04 гл.5","quote":"Море Трав, которое, судя по карте, занимало почти всю западную половину Круга, постепенно переходя в теневые области"},{"a":"more_trav","b":"krug_eltanir","kind":"к_югу_от","distance":"","source":"SK-04 гл.7","quote":"оно занимало почти всю южную, юго-западную и западную часть Круга, простираясь до теневых земель"},{"a":"pylayushchiy_rog","b":"more_trav","kind":"внутри","distance":"западный край Круга","source":"SK-06 гл.9","quote":"Если принять отметку фригольда за условный юг, то вторая — Пылающий Рог — оказалась на западной границе окружности."},{"a":"pylayushchiy_rog","b":"stena_zapad","kind":"граничит","distance":"","source":"SK-07 гл.20","quote":"Пылающий Рог был географически удобно расположен, с запада прикрытый Стеной, а с юга и востока — горами и световым кругом Элтанира"},{"a":"more_trav","b":"stena_zapad","kind":"граничит","distance":"","source":"SK-06 гл.9","quote":"Море Трав — защищено с двух сторон естественными границами, а третья, западная, как я теперь узнал, прикрыта загадочной Стеной."},{"a":"vladeniya_tavrov","b":"nebo","kind":"к_северу_от","distance":"≈700 км на СЗ","source":"SK-04 гл.5","quote":"капсулы упали на северо-западе от нас, в глубине Моря Трав. Около семисот километров по прямой от фригольда"},{"a":"tayushchie_roshchi","b":"ferma_eirika","kind":"к_северу_от","distance":"район падения 50×300 км; перелёт ~480 км","source":"SK-04 гл.10","quote":"Местность, куда падали метеоры, находилась на условном северо-востоке от нас… это тоже было Море Трав, но постепенно уходящее к Древнему Лесу."},{"a":"drevny_les","b":"more_trav","kind":"граничит","distance":"","source":"SK-04 гл.10","quote":"вытянутый овал в северной оконечности Моря Трав… заходящий на территорию так называемого Древнего Леса — огромного лесного массива, занимающего условный «запад» Круга."},{"a":"drevny_les","b":"este","kind":"к_северу_от","distance":"","source":"SK-06 гл.1","quote":"Южнее нас — владения Народа Реки, восточнее и севернее — обширные древние леса, которые считали своими сородичи погибшего Лохмача"},{"a":"zemli_naroda_reki","b":"este","kind":"к_югу_от","distance":"","source":"SK-06 гл.1","quote":"Южнее нас — владения Народа Реки"},{"a":"zemli_naroda_reki","b":"krug_eltanir","kind":"к_востоку_от","distance":"восток и юго-восток","source":"SK-09 гл.10","quote":"контролировал весьма обширные области речных долин, озер и лесов, занимая условный восток и юго-восток Круга."},{"a":"bolotnye_peshchery","b":"stena_yv","kind":"граничит","distance":"","source":"SK-06 гл.3","quote":"Болотных Пещер — неких затопленных тоннелей в исполинской стене на границе Круга"},{"a":"zolotoe_ozero","b":"bolotnye_peshchery","kind":"к_востоку_от","distance":"к СВ","source":"TB-01 гл.8","quote":"К северо-востоку от них озерный край принадлежал людям Золотого Озера, теплейшего и крупнейшего водоема в этом Круге."},{"a":"bolota_yv","b":"zemli_naroda_reki","kind":"к_востоку_от","distance":"","source":"TB-01 гл.8","quote":"А на юго-востоке до самой Стены простирались бесконечные болота"},{"a":"mertvaya_ryba","b":"bolotnye_peshchery","kind":"к_северу_от","distance":"далеко","source":"TB-01 гл.6","quote":"Мертвая Рыба, главный фригольд их клана, находился далеко на севере."},{"a":"este","b":"mertvaya_ryba","kind":"к_северу_от","distance":"за горной грядой","source":"TB-01 гл.12","quote":"Форель ведет его на север, к горной гряде, за которой когда-то виднелись башни Эстэ."},{"a":"strela_burnaya","b":"este","kind":"путь","distance":"","source":"TB-01 гл.7","quote":"Наконечник Стрелы на утёсе над рекой; за снежными горами — развалины древней столицы Круга (пересказ)"},{"a":"pustoshi_soli","b":"zemli_naroda_reki","kind":"к_югу_от","distance":"","source":"TB-01 гл.5","quote":"Далеко на юге, за горами, он видел белесые пустоши Соли и полосу теневых земель."},{"a":"gory_lyudey_gor","b":"nebo","kind":"к_востоку_от","distance":"","source":"TB-01 гл.1","quote":"В горных долинах «восточнее» колонии обитали три небольших клана Людей Гор"},{"a":"gory_lyudey_gor","b":"nebo","kind":"к_западу_от","distance":"","source":"SK-09 гл.4","quote":"там, к западу от наших владений, обитали разрозненные кланы Народов Гор и Пещер"},{"a":"severnoe_poberezhe","b":"krug_eltanir","kind":"к_северу_от","distance":"","source":"SK-04 гл.8","quote":"обитал далеко на севере нашего Круга, населяя побережье и острова. Люди Островов, Народ Моря"},{"a":"svyashchenny_gorod","b":"severnoe_poberezhe","kind":"внутри","distance":"","source":"SK-01 гл.15","quote":"один из золотых Восходящих правит Священным Городом на острове в северном море, там есть малый Круг."},{"a":"zapadny_post","b":"nebo","kind":"к_западу_от","distance":"≈25 миль","source":"SK-02 гл.12","quote":"Западный Пост находился примерно в двадцати пяти милях от фригольда, на единственной тропе, ведущей со стороны Расколотых Земель."},{"a":"gory_neba","b":"raskolotye_zemli","kind":"граничит","distance":"","source":"SK-02 гл.12","quote":"Горная гряда, отданная во владение нашему Народу, была естественной преградой между бесплодной, изборожденной трещинами равниной на краю Круга и Морем Трав"},{"a":"gory_neba","b":"more_trav","kind":"граничит","distance":"","source":"SK-02 гл.12","quote":"естественной преградой между… равниной на краю Круга и Морем Трав"},{"a":"rostok_neba","b":"yuzhny_post","kind":"граничит","distance":"","source":"SK-06 гл.26","quote":"точка посадки выглядела неплохо — примерно посередине между зданиями фригольда и приснопамятным Южным Постом."},{"a":"zmeiny_kanyon","b":"nebo","kind":"граничит","distance":"","source":"TB-01 гл.1","quote":"Змеиный Каньон был естественной границей горного фригольда."},{"a":"zmeiny_kanyon","b":"zapadny_post","kind":"путь","distance":"","source":"SK-06 гл.28","quote":"из фригольда туда вела всего одна тропа, заканчивающаяся у знакомой заставы Западного Поста."},{"a":"podkova","b":"nebo","kind":"граничит","distance":"~20 км","source":"SK-07 гл.10","quote":"дугообразное плато над Расколотыми Землями в паре десятков км от скальных стен фригольда (пересказ)"},{"a":"raskolotye_zemli","b":"krug_eltanir","kind":"к_югу_от","distance":"","source":"SK-06 гл.9","quote":"Они могут прийти только с юга, через Расколотые Равнины, преодолев горные цепи"},{"a":"raskolotye_zemli","b":"zemli_teney","kind":"граничит","distance":"≈300 км Расколотых Земель","source":"SK-03 гл.16","quote":"нужно было пересечь всю теневую полосу, а затем триста километров Расколотых Земель."},{"a":"raskolotye_zemli","b":"krug_eltanir","kind":"путь","distance":"2 дня пешком","source":"SK-03 гл.4","quote":"До Круга два дня пути, ты сумеешь выбраться"},{"a":"gnezdo_chervey","b":"raskolotye_zemli","kind":"внутри","distance":"~50 км от стоянки рейда","source":"SK-03 гл.1","quote":"Гнездо располагалось примерно в полусотне километров от нашей последней стоянки"},{"a":"kolonna_siyaniya","b":"raskolotye_zemli","kind":"внутри","distance":"зона без Рун ~9–10 миль","source":"SK-03 гл.7","quote":"Стоило пересечь невидимую границу — по моим прикидкам примерно девять-десять миль от аванпоста, — как совершенно неожиданным образом перестали работать Руны."},{"a":"nebesnye_kogti","b":"raskolotye_zemli","kind":"путь","distance":"200–300 км","source":"SK-03 гл.17","quote":"Народ Теней обитал всего в двухстах-трехстах километрах отсюда"},{"a":"zemli_teney","b":"krug_eltanir","kind":"граничит","distance":"","source":"SK-09 гл.7","quote":"Географически Земли Теней представляли собой незамкнутое полукольцо, прерванное на условном «севере» морским побережьем."},{"a":"chernaya_past","b":"zemli_teney","kind":"к_югу_от","distance":"","source":"SK-09 гл.7","quote":"На севере это океан, на юге — Черная Пасть, возле которой мне довелось побывать, на западе — Стена октагона."},{"a":"cherep_velikana","b":"zemli_teney","kind":"к_востоку_от","distance":"","source":"TB-03 гл.9","quote":"Руины древней кел-цитадели глубоко в тенях на восточной оконечности Круга."},{"a":"zemli_lunolikih","b":"zemli_teney","kind":"к_западу_от","distance":"","source":"SK-09 гл.5","quote":"Луноликим — могущественной септе Народа Теней, обитающей на северо-западе сумрачной зоны."},{"a":"zemli_lunolikih","b":"pylayushchiy_rog","kind":"к_западу_от","distance":"","source":"SK-09 гл.4","quote":"предполагаемое место падения находилось к западу от Пылающего Рога. … Но чуть севернее Луноликие"},{"a":"stena_zapad","b":"krug_eltanir","kind":"граничит","distance":"","source":"SK-09 гл.4","quote":"Подобная исполинскому горному хребту Стена рассекала горизонт, древняя и несокрушимая граница октагона, именно в этом месте близко подходя к пределам Круга."},{"a":"chernaya_past","b":"krug_tair","kind":"путь","distance":"≈1500 км Тьмы","source":"SK-10 гл.8","quote":"Ближайший к нам Круг Жизни, в самом узком месте отделенный от нашего прослойкой Тьмы всего лишь в полторы тысячи километров."},{"a":"molchanie","b":"chernaya_past","kind":"граничит","distance":"","source":"TB-03 гл.10","quote":"Лагеря у Черной Пасти: Молчание (пересказ)"},{"a":"krug_tair","b":"krug_zaov","kind":"путь","distance":"≈18 000 км напрямую; путь караванами","source":"SK-10 гл.14","quote":"От Таира до Заова — не очень далеко, если напрямую. Какие-то восемнадцать тысяч километров"},{"a":"karavanny_krug","b":"lazurnoe_oko","kind":"путь","distance":"","source":"SK-10 гл.15","quote":"древний путь — от Караванного Круга Таира к Стреле под названием «Лазурное Око»"},{"a":"lazurnoe_oko","b":"krug_zaov","kind":"соединено_порталом","distance":"","source":"SK-10 гл.15","quote":"Также ее называли Глазом Заова — пройдя сквозь эту Стрелу, караваны попадали в этот Круг."},{"a":"taelan","b":"krug_zaov","kind":"граничит","distance":"","source":"SK-10 гл.20","quote":"Круг Таэлан, по сути, пограничный, мы пересечем по диагонали его окраину, а затем сделаем большой крюк над равнинами Круга Аурантис"},{"a":"serebryanoe_more","b":"krug_zaov","kind":"к_югу_от","distance":"","source":"SK-10 гл.20","quote":"кольцом Световых Рек… на условном юге вливающиеся в Серебряное Море"},{"a":"kayr_elis","b":"krug_zaov","kind":"к_северу_от","distance":"","source":"SK-10 гл.20","quote":"агрессивный Народ Льда контролировал условный «север» вокруг Кайр’Элис, Ледяного Венца"},{"a":"novaya_zarya","b":"krug_zaov","kind":"к_востоку_от","distance":"юго-восток","source":"SK-10 гл.20","quote":"На юго-востоке мерцала золотая маленькая искра — Новая Заря."},{"a":"novaya_zarya","b":"liberti","kind":"путь","distance":"≈300 км (древодень пути)","source":"SK-11 гл.19","quote":"находилось совсем недалеко от Либерти (конечно, по меркам Единства — в каких-то трехстах километрах)"},{"a":"liberti","b":"kamennoe_more","kind":"граничит","distance":"≈50 км","source":"SK-10 гл.21","quote":"Колония располагалась примерно в пятидесяти километрах от шельфового обрыва Каменного Моря"},{"a":"novaya_zarya","b":"kamennoe_more","kind":"граничит","distance":"","source":"SK-11 гл.18","quote":"у Новой Зари — золотого Игга на краю Каменного Моря — имелся свой Храм Вечности"},{"a":"zhily_zari","b":"krug_zaov","kind":"граничит","distance":"","source":"SK-10 гл.21","quote":"Жилы Зари… когда-то они были естественной границей конгломерации Древ Заова — до того, как вспыхнуло Древо Новая Заря."},{"a":"aurantis","b":"novaya_zarya","kind":"граничит","distance":"","source":"SK-11 гл.19","quote":"С тыла и фланга его подпирают Круги Заова и Аурантиса, поэтому теневого кольца тут не существует"},{"a":"chernaya_past","b":"krug_eltanir","kind":"соединено_порталом","distance":"десятки тысяч км (рунный перенос)","source":"SK-11 гл.21","quote":"за мгновение преодолела в тоннеле рваного света десятки тысяч километров — и в глаза брызнул родной, золотой свет Элтанира."},{"a":"perekrestok","b":"otmeli_velikoy_reki","kind":"соединено_порталом","distance":"","source":"TB-05 гл.2","quote":"Ушли Руной-Порталом с Перекрестка на Отмели Великой Реки (пересказ)"},{"a":"otmeli_velikoy_reki","b":"krug_yantander","kind":"путь","distance":"Прозрачные Дороги","source":"TB-05 гл.3","quote":"Тропа честно вела в Круг Янтандера, выходя в плохом месте — на границе опустошенных земель и владений, что контролировали кель-рода Семи Курганов."},{"a":"krug_yantander","b":"temnye_zemli","kind":"граничит","distance":"","source":"TB-05 гл.4","quote":"С двух сторон их отравленные воды дышали на Янтандер ядовитыми ветрами, третью границу охраняла Тьма, за четвертой же на много дней пути простирались опустошенные земли."},{"a":"mednye_bashni","b":"arandar","kind":"граничит","distance":"","source":"TB-05 гл.4","quote":"Великое Древо почти поглотило его, оставив разумным лишь полукольцо окраинных зданий."},{"a":"kurgany","b":"zamok_talas","kind":"путь","distance":"дневной переход","source":"TB-05 гл.4","quote":"в дневном переходе лежал Замок, чьи сигнальные Руны никогда не спали, за ним — еще пять цитаделей"},{"a":"krug_yantander","b":"este","kind":"соединено_порталом","distance":"","source":"TB-05 Эпилог","quote":"Морри считает выходящих из Портала… Эстэ: золотой Игг (пересказ) — эвакуация Талас в Город Молний"},{"a":"ergial","b":"ledyanaya_bezdna","kind":"внутри","distance":"8 часов полёта Крылана до знакомых Древ","source":"TB-02 гл.6","quote":"Ближайшим Древом был Норталис, это его свет озарял половину неба, будучи высочайшим, северным маяком Ледяной Бездны."},{"a":"vrata_garmonii","b":"ergial","kind":"граничит","distance":"кольцо блокады ~200 км","source":"SK-08 гл.20","quote":"эти штуки, образующие почти идеальный круг диаметром в две сотни километров, предназначены для пространственной блокады."},{"a":"serebryany_zamok","b":"kriptа_yadra_zamka","kind":"соединено_порталом","distance":"","source":"SK-08 гл.2","quote":"за Стрелой Домена находились темные земли — одна из самых опасных локаций Единства."},{"a":"serebryany_zamok","b":"gnezdo_chervey","kind":"соединено_порталом","distance":"","source":"SK-02 Эпилог","quote":"Руна Серебряного Замка (выход) выкинет в точку входа — Гнездо Червей (пересказ)"},{"a":"razbitaya_skrizhal","b":"bashnya_molniy","kind":"соединено_порталом","distance":"","source":"TB-03 гл.4","quote":"Стрела Домена → Башня Молний (пересказ)"},{"a":"hram_eltanir","b":"tingvellir","kind":"соединено_порталом","distance":"","source":"SK-06 гл.12","quote":"Настоящий Храм — на «летающем острове» над панорамой Золотого Города… каждый попадает в свой Храм (пересказ)"},{"a":"hramy_vechnosti","b":"chertogi_ozhidaniya","kind":     el("path", {d: "M0 0 H1000", stroke: "#b3abcf", "stroke-width": 2, "vector-effect": "non-scaling-stroke"}, s);
    el("path", {d: "M0 -40 V40 M500 -25 V25 M1000 -40 V40", stroke: "#b3abcf", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke"}, s);
    lbl(s, 500, -70, "≈ 1000 км (вне растянутых зон)", 10, "lbl-note");
  }
  if (v === "edinstvo") {
    rg("inner", [["0", "#1b1730", 1], [".85", "#110f1f", 1], ["1", "#0b0a14", 1]]);
    el("circle", {cx: 0, cy: 0, r: 800, fill: "url(#inner)", stroke: "#4a4270", "stroke-width": 10}, g);
    el("circle", {cx: 0, cy: 0, r: 800, fill: "none", stroke: "#e3b860", "stroke-opacity": .25, "stroke-width": 1, "stroke-dasharray": "3 9", "vector-effect": "non-scaling-stroke"}, g);
    // Брешь — разрыв оболочки сверху
    el("path", {d: "M-40 -799 A800 800 0 0 1 40 -799", stroke: "#63c7ec", "stroke-width": 12, fill: "none"}, g);
    // Небесный Трон
    const t = el("g", {class: "pt has", tabindex: 0, role: "button", "aria-label": "Небесный Трон"}, g);
    el("ellipse", {cx: 0, cy: 0, rx: 150, ry: 34, fill: "none", stroke: "#63c7ec", "stroke-opacity": .7, "stroke-width": 7}, t);
    el("path", {d: "M0 -300 L9 0 L0 300 L-9 0 Z", fill: "#63c7ec", "fill-opacity": .55}, t);
    el("circle", {cx: 0, cy: 0, r: 26, fill: "#000", stroke: "#63c7ec", "stroke-width": 2}, t);
    t.addEventListener("click", e => { e.stopPropagation(); select("nebesny_tron"); });
    lbl(g, 0, 345, "НЕБЕСНЫЙ ТРОН", 13);
    const vv = el("g", {class: "pt" + (evByLoc.vechnost ? " has" : ""), tabindex: 0, role: "button"}, g);
    lbl(vv, 0, -330, "Вечность (внутри Трона) ⟶ список", 11, "lbl-note");
    vv.addEventListener("click", e => { e.stopPropagation(); go("vne"); });
    lbl(g, 0, 440, "обитаемая внутренняя поверхность: Круги Жизни вокруг Игг-Древ, между ними — Тьма", 10.5, "lbl-note");
    lbl(g, 0, -960, "СНАРУЖИ: КОСМОС, ИЛЛИУМОВАЯ БРОНЯ С ИНСКРИПЦИЯМИ", 11, "lbl-note");
  }
  if (v === "zaov") {
    rg("zl", [["0", "#bfe7c9", .45], [".6", "#6aa58a", .14], ["1", "#2a2342", 0]]);
    const oct = octagon(1000).map(p => p.join(",")).join(" ");
    el("polygon", {points: oct, fill: "#0b0a14", stroke: "#4a4270", "stroke-width": 2, "vector-effect": "non-scaling-stroke"}, g);
    el("path", {d: "M-1000 0 A1000 1000 0 0 0 0 1000 L0 0 Z", fill: "#07060d", "fill-opacity": .65}, g);
    el("circle", {cx: 0, cy: 0, r: 760, fill: "url(#zl)"}, g);
    el("circle", {cx: 0, cy: 0, r: 230, fill: "none", stroke: "#63c7ec", "stroke-opacity": .5, "stroke-width": 1.5, "stroke-dasharray": "5 5", "vector-effect": "non-scaling-stroke"}, g);
    lbl(g, 0, -245, "кольцо Световых Рек", 10, "lbl-note");
    const tr = el("g", {class: "pt has", tabindex: 0, role: "button", "aria-label": "Эль-Заов"}, g);
    el("circle", {cx: 0, cy: 0, r: 30, fill: "#bfe7c9"}, tr); tr.addEventListener("click", e => { e.stopPropagation(); select("el_zaov"); });
    lbl(g, 0, 70, "ЭЛЬ-ЗАОВ", 13).setAttribute("fill", "#bfe7c9");
    lbl(g, -560, 620, "юг и запад — во Тьме", 10.5, "lbl-note");
    // Башни на углах
    octagon(1000).forEach(([x, y], i) => { if (i % 2 === 0) el("rect", {x: x - 14, y: y - 14, width: 28, height: 28, fill: "#4a4270"}, g); });
    lbl(g, 930, 300, "Башня", 10, "lbl-note");
  }
  if (v === "yantander") {
    rg("yl", [["0", "#e88a6a", .40], [".6", "#8a4b3a", .14], ["1", "#2a2342", 0]]);
    el("circle", {cx: 0, cy: 0, r: 780, fill: "url(#yl)"}, g);
    el("circle", {cx: 0, cy: 0, r: 720, fill: "none", stroke: "#e3b860", "stroke-opacity": .45, "stroke-width": 1.5, "stroke-dasharray": "8 6", "vector-effect": "non-scaling-stroke"}, g);
    lbl(g, 0, -735, "рэйя — купол над Кругом, опирается на шесть Замков", 10, "lbl-note");
    for (let i = 0; i < 7; i++) { const a = (-90 + i * 360 / 7) * Math.PI / 180; el("path", {d: `M${470 * Math.cos(a) - 34} ${470 * Math.sin(a) + 14} Q${470 * Math.cos(a)} ${470 * Math.sin(a) - 40} ${470 * Math.cos(a) + 34} ${470 * Math.sin(a) + 14} Z`, fill: "#6e5a8a", "fill-opacity": .8}, g); }
    lbl(g, 0, -390, "Семь Курганов (узники — Братья Тысячи)", 10, "lbl-note");
    const tr = el("g", {class: "pt has", tabindex: 0, role: "button"}, g);
    el("circle", {cx: 0, cy: 0, r: 30, fill: "#e88a6a"}, tr); tr.addEventListener("click", e => { e.stopPropagation(); select("arandar"); });
    lbl(g, 0, 70, "АРАНДАР · АЛЫЙ КОРЕНЬ", 12.5).setAttribute("fill", "#f0b39d");
  }
}

// ---------- «вне пространства» ----------
function renderCards() {
  const box = $("#cards"); box.innerHTML = "";
  const groups = [
    ["Вечность", l => l.parent === "vechnost" || l.id === "vechnost" || byId[l.parent]?.parent === "vechnost"],
    ["Храмы Вечности", l => l.type === "храм"],
    ["Домены и иные пространства", l => true],
  ];
  const off = DATA.locations.filter(l => !l.placed);
  const used = new Set();
  groups.forEach(([name, f]) => {
    const items = off.filter(l => !used.has(l.id) && f(l)); if (!items.length) return;
    box.appendChild(h(`<div class="grouph">${esc(name)}</div>`));
    items.forEach(l => { used.add(l.id); const n = (evByLoc[l.id] || []).filter(e => !state.book || e.book === state.book).length; const b = document.createElement("button"); b.className = "card"; b.innerHTML = `<div class="n">${esc(l.name)}</div><div class="d">${esc(l.desc)}</div>${n ? `<div class="e">${n} соб.${state.book ? " в " + state.book : ""}</div>` : ""}`; b.onclick = () => select(l.id); if (state.book && !n && !routeSet().has(l.id)) b.style.opacity = .35; box.appendChild(b); });
  });
}

// ---------- выбор и панель ----------
function select(id) { state.sel = id; const v = viewOf(id); if (v !== state.view) { state.view = v; history.replaceState(null, "", "#" + v); const conf = VIEWS.find(x => x.id === v); state.base = conf.box; state.vb = conf.box ? conf.box.slice() : null; } render(); showPanel(); if (state.vb) centerOn(id); }
function centerOn(id) { const p = DATA.views[state.view]?.[id]; if (!p) return; const [x, y, w, hh] = state.vb; if (p[0] < x || p[0] > x + w || p[1] < y || p[1] > y + hh) { state.vb[0] = p[0] - w / 2; state.vb[1] = p[1] - hh / 2; setVB(); } }

function evHTML(e, hit) { return `<div class="ev${hit ? " hit" : ""}"><div class="h"><span class="code">${esc(e.book)}</span><span class="ch">${esc(e.chapter ? "гл. " + e.chapter : "")}</span></div><div class="t">${esc(e.title)}</div><div class="s">${esc(e.summary)}</div>${e.characters?.length ? `<div class="who">${esc(e.characters.join(", "))}</div>` : ""}</div>`; }
function locLink(id) { const l = byId[id]; return l ? `<button class="loc" data-loc="${esc(id)}">${esc(shortName(l.name))}</button>` : esc(id); }
const KIND = {"граничит":"граничит с","к_северу_от":"к северу от","к_югу_от":"к югу от","к_востоку_от":"к востоку от","к_западу_от":"к западу от","внутри":"внутри","соединено_порталом":"соединено порталом с","путь":"путь до"};

function showPanel() {
  let html = "";
  if (state.sel) {
    const l = byId[state.sel];
    const evs = (evByLoc[l.id] || []).slice().sort((a, b) => BOOKS.indexOf(a.book) - BOOKS.indexOf(b.book));
    const pos = DATA.views[state.view]?.[l.id]?.[2];
    html += `<h2>${esc(l.name)}</h2><div class="meta"><span class="pill">${esc(typeName(l))}</span>${certPill(l.cert)}${pos === "схема" ? `<span class="pill guess">положение условное</span>` : ""}${l.xd ? `<span class="pill">вне обычного пространства</span>` : ""}</div>`;
    if (l.desc) html += `<p>${esc(l.desc)}</p>`;
    if (l.terrain) html += `<p><b>Облик:</b> ${esc(l.terrain)}</p>`;
    if (l.peoples?.length) html += `<p><b>Кто живёт:</b> ${esc(l.peoples.join(", "))}</p>`;
    if (l.parent && byId[l.parent]) html += `<p><b>Входит в:</b> ${locLink(l.parent)}</p>`;
    const kids = DATA.locations.filter(x => x.parent === l.id); if (kids.length) html += `<p><b>Внутри:</b> ${kids.map(k => locLink(k.id)).join(", ")}</p>`;
    if (l.first) html += `<p><b>Первое упоминание:</b> ${esc(l.first)}</p>`;
    if (OPENS[l.id] && OPENS[l.id] !== state.view) html += `<p><button class="tool" data-go="${OPENS[l.id]}">Открыть карту «${esc(VIEWS.find(v => v.id === OPENS[l.id]).name)}» →</button></p>`;
    html += `<h3>События (${evs.length})</h3>` + (evs.length ? evs.map(e => evHTML(e, state.book === e.book)).join("") : `<p>Отмеченных событий нет.</p>`);
    const rels = relByLoc[l.id] || [];
    if (rels.length) html += `<h3>Положение по тексту</h3>` + rels.map(r => { const other = r.a === l.id ? r.b : r.a; const dir = r.a === l.id ? `${KIND[r.kind] || r.kind} ${locLink(other)}` : `${locLink(other)} — ${KIND[r.kind] || r.kind} этого места`; return `<div class="rel">${dir}${r.distance ? ` · <b>${esc(r.distance)}</b>` : ""} <span class="ch">(${esc(r.source)})</span>${r.quote ? `<q>${esc(r.quote)}</q>` : ""}</div>`; }).join("");
    html += `<p style="margin-top:14px"><button class="loc" id="back">← к обзору</button></p>`;
  } else if (state.book) {
    const r = DATA.routes.find(r => r.book === state.book);
    const evs = DATA.events.filter(e => e.book === state.book);
    html += `<h2>${esc(state.book)} · ${esc(TITLES[state.book])}</h2><div class="meta"><span class="pill">${state.book.startsWith("SK") ? "Звездная Кровь" : "Тысяча Братьев"}</span>${r ? `<span class="pill">герой: ${esc(r.hero)}</span>` : ""}</div>`;
    if (r) html += `<h3>Маршрут</h3><ol class="route">${r.path.map(id => { const v = viewOf(id); const vn = VIEWS.find(x => x.id === v).name; return `<li>${locLink(id)}${v !== state.view ? ` <span class="off">· ${esc(vn)}</span>` : ""}</li>`; }).join("")}</ol>${r.note ? `<p>${esc(r.note)}</p>` : ""}`;
    html += `<h3>События книги (${evs.length})</h3>` + evs.map(e => `<div>${locLink(e.location)}</div>` + evHTML(e, true)).join("");
  } else {
    const placed = DATA.locations.filter(l => l.placed).length;
    html += `<h2>Как читать атлас</h2><p>Выберите уровень карты вверху и книгу в строке фильтра: на карте появится маршрут героя, а здесь — все события книги по порядку. Нажмите на место, чтобы увидеть его описание, события и цитаты о том, где оно находится.</p>`;
    html += `<div class="stat"><div><b>${DATA.locations.length}</b><span>мест</span></div><div><b>${DATA.events.length}</b><span>событий</span></div><div><b>${DATA.relations.length}</b><span>связей с цитатами</span></div></div>`;
    html += `<p>Направления в книгах почти всегда условные: земляне считают фригольд Небо югом, а Древо — центром Круга. Пунктирные маркеры — места, точное положение которых автор не называет. Из ${DATA.locations.length} мест на схемы нанесено ${placed}; остальные (Вечность, Храмы, Домены) — во вкладке «Вне пространства».</p>`;
    html += `<h3>Самые насыщенные места</h3>` + Object.entries(evByLoc).sort((a, b) => b[1].length - a[1].length).slice(0, 8).map(([id, e]) => `<div class="rel">${locLink(id)} · ${e.length} соб.</div>`).join("");
    html += `<h3>Источник</h3><p>Данные — <code>bible/geo/gazetteer.json</code> и <code>geography.md</code> в репозитории; раскладка — <code>tools/map_layout.py</code>.</p>`;
  }
  panel.innerHTML = html; panel.scrollTop = 0;
  panel.querySelectorAll("[data-loc]").forEach(b => b.onclick = () => select(b.dataset.loc));
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { state.sel = null; go(b.dataset.go); });
  const back = panel.querySelector("#back"); if (back) back.onclick = () => { state.sel = null; render(); showPanel(); };
}

// ---------- поиск ----------
const q = $("#q");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); if (!s) { showPanel(); return; }
  const res = DATA.locations.filter(l => l.name.toLowerCase().includes(s) || l.desc.toLowerCase().includes(s)).slice(0, 30);
  panel.innerHTML = `<h2>Поиск: ${esc(q.value)}</h2><div class="results">${res.map(l => `<div class="rel">${locLink(l.id)} <span class="ch">· ${esc(VIEWS.find(v => v.id === viewOf(l.id)).name)}</span></div>`).join("") || "<p>Ничего не найдено.</p>"}</div>`;
  panel.querySelectorAll("[data-loc]").forEach(b => b.onclick = () => { q.value = ""; select(b.dataset.loc); });
});

// ---------- зум и панорама ----------
function zoom(f, cx, cy) { if (!state.vb) return; const [x, y, w, hh] = state.vb; const nw = Math.min(Math.max(w * f, state.base[2] / 12), state.base[2] * 1.5), nh = nw * hh / w; if (cx === undefined) { cx = x + w / 2; cy = y + hh / 2; } state.vb = [cx - (cx - x) * nw / w, cy - (cy - y) * nh / hh, nw, nh]; setVB(); }
function toMap(ev) { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener("wheel", ev => { ev.preventDefault(); const p = toMap(ev); zoom(ev.deltaY > 0 ? 1.15 : 1 / 1.15, p.x, p.y); }, {passive: false});
let drag = null;
svg.addEventListener("pointerdown", ev => { if (ev.target.closest(".pt, .region")) return; drag = {x: ev.clientX, y: ev.clientY, vb: state.vb.slice(), moved: false}; svg.setPointerCapture(ev.pointerId); svg.classList.add("drag"); });
svg.addEventListener("pointermove", ev => { if (!drag) return; const m = svg.getScreenCTM(); const dx = (ev.clientX - drag.x) / m.a, dy = (ev.clientY - drag.y) / m.d; if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 3) drag.moved = true; state.vb = [drag.vb[0] - dx, drag.vb[1] - dy, drag.vb[2], drag.vb[3]]; setVB(); });
svg.addEventListener("pointerup", ev => { if (drag && !drag.moved && state.sel) { state.sel = null; render(); showPanel(); } drag = null; svg.classList.remove("drag"); });
$("#zin").onclick = () => zoom(1 / 1.4); $("#zout").onclick = () => zoom(1.4); $("#zreset").onclick = () => { state.vb = state.base.slice(); setVB(); };

$("#noteclose").onclick = () => { state.noteHidden = true; $("#note").hidden = true; };
go(location.hash.slice(1) || "eltanir");
</script>
