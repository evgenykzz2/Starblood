site_name: Звездная Кровь — Вики
site_description: Неофициальная фанатская энциклопедия вселенной «Звездная Кровь» и «Тысяча Братьев» Романа Прокофьева
site_url: https://evgenykzz2.github.io/Starblood/
repo_url: https://github.com/evgenykzz2/Starblood
repo_name: evgenykzz2/Starblood
edit_uri: edit/main/docs/
copyright: Неофициальный фанатский проект. Все права на произведения принадлежат Роману Прокофьеву.

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема (пергамент)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема (ночь Единства)
  font:
    text: PT Sans
    code: PT Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.action.edit

plugins:
  - search:
      lang:
        - ru
        - en

hooks:
  - hooks/character_images.py

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/theme.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/ranks.js

